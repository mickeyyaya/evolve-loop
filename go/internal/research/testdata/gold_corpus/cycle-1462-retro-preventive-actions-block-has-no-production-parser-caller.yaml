- id: cycle-1462-retro-preventive-actions-block-has-no-production-parser-caller
  pattern: "the-retrospective-prompt-mandates-a-machine-readable-preventive-actions-json-block-and-documents-that-internal-retrofile-parses-it-into-inbox-items-but-retrofile-parsepreventiveactions-has-zero-production-callers-so-every-correctly-authored-block-is-dead-text-and-a-perfectly-diagnosed-fix-never-becomes-work"
  description: >-
    `retrofile.ParsePreventiveActions` (go/internal/retrofile/retrofile.go:48)
    has ZERO non-test callers in the repository. The only production caller of
    the package at all is `retrofile.FileActions` at
    go/internal/recurrence/apply.go:130, which files contract-gate demotions and
    constructs its `PreventiveAction` values in Go — it never reads a
    retrospective report. So the retro agent's mandated

      ## Recommended preventive actions
      ```json
      [ {"id": ..., "title": ..., "weight_hint": ...} ]
      ```

    block — the contract the retrospective prompt describes as "the deterministic
    post-retro autofiler parses this block and files each entry as a weighted
    .evolve/inbox/auto-retro-<cycle>-<slug>.json todo" — is parsed by nothing.

    Proof on disk, cycle-1456 -> cycle-1462:

      $ grep -rn 'retrofile\.\(Parse\|Extract\)' go/ --include='*.go'
      (no output)                       # the parser has no caller, test or prod

      $ find .evolve/inbox -name 'auto-retro-*'
      .evolve/inbox/auto-retro-0-contract-gate-demoted-adversarial-review.json
      .evolve/inbox/auto-retro-0-contract-gate-demoted-build.json
      .evolve/inbox/auto-retro-0-contract-gate-demoted-flake-rerun-scan.json
      # cycle "0" only — the recurrence/apply.go path. No auto-retro-1456-*,
      # no auto-retro-<any real cycle>-*, anywhere in the inbox tree.

      $ grep -rl 'ship-stage-ignored-tracked-partition' .evolve/inbox/
      (no output)

    Cycle-1456's retrospective did everything right: it wrote a well-formed
    six-entry block whose first action —
    `ship-stage-ignored-tracked-partition`, weight_hint 0.97, files
    `go/internal/phases/ship/gitops.go` — is the EXACT fix for the defect that
    then killed cycle-1462 six cycles later with a byte-identical fingerprint
    (`ship|unknown|99c38818197c`). No inbox item was ever created, so Triage
    never saw it, so no lane ever built it.

    This is the `lesson_to_action_gap` meta-defect in its purest form: the
    learning machinery's failure mode is not bad diagnosis, it is a correct
    diagnosis written to a channel with no reader. A grader that only checks
    "did the retro emit the block?" passes on 100% of these cycles.
