  preventiveAction: >-
    WIRE THE PARSER. Call `retrofile.ParsePreventiveActions` on
    `<workspace>/retrospective-report.md` at the deterministic retro-closeout
    seam (`go/internal/core/failure_learning.go`, beside the existing
    `retroRemediationItems` / `faillearn.WithInbox` call at :473-475, which
    already owns the inbox-write boundary), then hand the result to
    `retrofile.FileActions(inboxDir, cycle, actions, defaultWeight, now)`. Log
    the filed paths into the cycle result so an operator can see the count.
    GRADE THE OUTCOME, NOT THE EMISSION: the regression test must assert that a
    fixture retrospective-report.md containing a two-entry block yields two
    `.evolve/inbox/auto-retro-<cycle>-<slug>.json` files on disk with the
    declared weights — asserting the block was *written* is exactly the vacuous
    check that let this survive. Add a standing ACS predicate: for every cycle
    whose retrospective-report.md contains a `preventive_actions` block, at
    least one `auto-retro-<cycle>-*` item exists (or a recorded dedup hit
    against an open/processed id explains its absence). BEHAVIOURAL: never
    conclude a documented pipeline contract is live because the prompt describes
    it and the package exists — `grep` for a production caller of the entry
    point before trusting that a channel has a reader.
