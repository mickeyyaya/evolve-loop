      - "closure claim without a citation, fired on the D-1 heading '... is NOT closed ...' — a denial of closure recorded as an assertion of closure"
    priorOccurrences: ["cycle-1339", "cycle-1371"]
    upstreamSignals:
      - "closure_claim.go:69-76 already documents this exact failure mode as the motivation for the previous fix; the fix covered the quoted form only"
