  governingVariable: >-
    Wrong assumption: "a bypass-resistant gate may ignore negation, because
    accepting negation as a signal is cheaper to forge than a citation." True
    relationship: forgeability and correctness are different axes, and a
    detector that cannot distinguish assertion from denial is not
    bypass-resistant — it is simply wrong in both directions at once. The
    honest resolution is not to accept "not closed" as an EXCUSE but to stop
    classifying it as a CLAIM: a line whose closure token is syntactically
    negated makes no closure assertion, so there is nothing for the citation
    requirement to attach to. That change removes an offender; it grants no
    bypass, because a laundering report that says "not closed" has laundered
    nothing.
  preventiveAction: >-
    (1) NEGATED CLOSURE IS NOT A CLOSURE CLAIM. Treat `not closed`,
    `is NOT closed`, `still open`, `remains open`, `never closed` as removing
    the line from the CLAIM scan (not as satisfying the CITATION requirement).
    Pin with the real cycle-1428 heading verbatim asserting zero offenders, plus
    the cycle-1255-shaped true positive still flagged, so the change is not a
    blanket weakening.
    (2) LAND CYCLE-1371's PRESCRIPTION AT THE SAME TIME — strip backticked code
    spans from the claim scan (keep them for the citation scan). Two recorded
    false-positive shapes, one file, one edit window; fixing them separately has
    already cost three cycles.
    (3) WIDEN THE ACCEPTED CITATION SET as cycle-1339 prescribed (ACS predicate
    names `TestC<cycle>_\d+`, `go/acs/cycle<N>/` paths, probe artifact paths
    under `.evolve/runs/cycle-<N>/`). The cycle-1428 D-1 heading is followed
    four lines later by exactly such a citation — the gate's line-locality is
    what makes an honest report non-compliant.
    (4) NEVER PRESCRIBE A REMEDY ARTIFACT WITHOUT CHECKING IT EXISTS. When
    `defect-dispositions.json` is absent from the workspace, the closure-claim
    diagnostic must say so rather than instructing the author to cite it; the
    two diagnostics in this cycle's fail-reason contradict each other.
    (5) OWNERSHIP: audit-gate code is pipeline-integrity, console-owned
    (`feedback_pipeline_fixes_console_first`). The lane graded by this gate must
    not be the lane that edits it.
