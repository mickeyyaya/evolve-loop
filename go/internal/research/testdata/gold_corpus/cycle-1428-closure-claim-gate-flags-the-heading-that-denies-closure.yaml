- id: cycle-1428-closure-claim-gate-flags-the-heading-that-denies-closure
  pattern: "the-closure-claim-gate-fired-on-the-auditors-heading-the-inherited-cycle-1424-critical-is-not-closed-because-negation-markers-were-deliberately-excluded-as-a-signal-so-the-report-that-blocks-a-laundered-closure-is-itself-recorded-as-an-uncited-closure-claim"
  description: >-
    The third blocking reason in `.evolve/runs/cycle-1428/audit-fail-reason.json`
    is:

      closure claim without a citation: "### D-1 — CRITICAL: the inherited
      cycle-1424 CRITICAL is NOT closed; the ambiguity guard is still
      silenceable" — a report may not assert a prior cycle's defect is closed
      without naming the per-defect record on the same line.

    The quoted line asserts the exact OPPOSITE of closure. It is the heading of
    the auditor's CRITICAL finding — the sentence that BLOCKS the cycle. The
    gate converted the strongest anti-laundering statement in the document into
    an offender.

    THIS IS BY DESIGN, AND THE DESIGN NOTE SAYS SO.
    `go/internal/phases/audit/closure_claim.go:80-84`:

      "Explicit negation markers ('still open', 'not closed') were considered
       as a second signal and DELIBERATELY REJECTED — they would hand the gate a
       bypass strictly cheaper than the citation it demands, since appending
       'not closed' is one token and evidences nothing."

    The reasoning is defensible in isolation and wrong in aggregate, because the
    same file (:69-76) already records the symmetric failure it was built to
    prevent: "substring matching therefore FAILED the auditor who correctly
    reported that defect as still open, which is worse than useless." The
    quote-stripping fix addressed the QUOTED form of that case and left the
    UNQUOTED form — an auditor stating in its own voice that a defect is open —
    firing exactly as before.

    THIRD RECORDED FIRING OF THE FALSE-POSITIVE CLASS: cycle-1339 (demanded a
    record the closed defect never had), cycle-1371 (fired on the backticked
    task id `chain-boundary-binary-refresh-verify-closed` plus a `cycle-164`
    precedent citation), cycle-1428 (fires on a negated closure statement).
    Each produced a lesson; none produced a code change
    ([[lesson_to_action_gap]]).

    THE COMPLIANT EXITS ARE ALL BAD, WHICH IS THE DIAGNOSTIC. To report "the
    inherited CRITICAL is not closed" without tripping the gate, an auditor must
    (a) append `defect-dispositions.json` to the heading — the one-token
    appeasement the design explicitly set out to prevent, and which here would
    cite a file that DOES NOT EXIST in this workspace; (b) avoid naming the
    ancestor cycle, destroying traceability; or (c) not say the defect is open.
    A gate whose only compliant paths are appeasement, vagueness, or silence
    selects against the reports it exists to protect.

    BLAST RADIUS THIS CYCLE was bounded — the audit FAILed on its own merits
    (D-1 is real and probe-confirmed), so the false positive added noise rather
    than causing the verdict. That is luck, not containment: on a cycle whose
    auditor correctly reports an inherited defect as still open while everything
    else passes, this gate manufactures the block.
