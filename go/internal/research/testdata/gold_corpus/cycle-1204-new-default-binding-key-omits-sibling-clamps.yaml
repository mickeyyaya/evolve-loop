  reviewerNote: >
    The build report DID name a fusion risk and DID mitigate it — risk (b), "full-clique edges
    would blow up edge count", mitigated by copying the spanning-chain pattern. That mitigation
    is real and the auditor verified it (len(group)-1 edges, no blowup). The miss is that the
    risk register was scoped to EDGE COUNT (a performance property) while the siblings' clamps
    exist for CLUSTER SIZE and WEIGHT (scheduling and selection properties). Copying a
    sibling's spanning-chain shape addresses the cheap risk and inherits none of the expensive
    ones. Worth noting when tuning builder risk-register prompts: "how many edges" and "how
    big may one cluster get" are different questions, and only the second is what
    hubAreaMaxItems and the campaign partition were built to answer.
