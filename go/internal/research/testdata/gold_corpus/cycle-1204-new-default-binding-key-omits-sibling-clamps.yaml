- id: cycle-1204-new-default-binding-key-omits-sibling-clamps
  pattern: "new-peer-added-to-a-rule-set-copies-the-happy-path-shape-but-not-the-clamps-its-siblings-earned-from-measured-incidents"
  description: >
    Cycle-1204 added `rootCauseRule` as the THIRD default-on binding signal in
    `go/internal/inboxbatch/rules.go` `DefaultRules()`. The builder's stated method was to
    "mirror `campaignRule`'s shape exactly" (build-report.md:15) and it did — the spanning-chain
    edge construction, the `byX` map-then-chain body, the `TrimSpace` empty guard. What it
    mirrored was the SHAPE. What it did not carry is the set of clamps its siblings each
    acquired the hard way:
    - `campaignRule` fusion is bounded because `campaign` is a PARTITION: `Classify`
      (classify.go:66-91) refuses to union two distinct non-empty campaigns on any inferred
      edge — a guard added after the measured 2026-07-28 incident (17 campaigns collapsed into
      one ~37-item serialized cluster).
    - `fileAreaRule` is bounded above by `hubAreaMaxItems = 5` and below by `minAreaDepth = 2`,
      BOTH added after measured fusion incidents documented in the file itself
      (55/61 items, then 43/84 items — rules.go:88-108).
    - `rootCauseRule` shipped with NO group-size ceiling and NO provenance check. Any writer,
      including an agent autofiling into `.evolve/inbox/`, asserts "these items are the same
      defect" and the classifier believes it unconditionally.
    Adversarial review demonstrated both consequences with an executed probe against the real
    `Classify`/`RenderMarkdown` path (F2): 11 campaign-less items sharing one forged
    `root_cause` collapse into a single cluster chunked into 3 sequential `DependsOnPrev`
    batches (scheduling starvation — the exact mode the campaign partition guard exists to
    prevent, re-opened through an unguarded field), and because batch weight is
    `max(member weight)` (classify.go:130-136) three 0.1-weight fillers ride into the
    top-ranked batch at weight 0.95 (weight amplification — work reaches build with no
    independent justification).
    Exposure is bounded, and bounded by ACCIDENT rather than by design: root-cause edges DO
    inherit the campaign partition guard, because `Classify` applies it per-edge regardless of
    which rule emitted the edge. So only campaign-less items can fuse — which, for an
    autofiled backlog, is the common case (19 of the 20 live items carrying `root_cause` have
    an empty `campaign`).
    THE ORDERING TRAP: this defect is latent rather than live ONLY because of the sibling
    defect D1 (the key is prose, so nothing groups). The two defects MASK EACH OTHER, which is
    why neither surfaced as a test failure and why six green tests plus a clean adversarial
    severity ceiling of MEDIUM coexisted with a rule that is simultaneously a no-op and a trap.
    The moment a normalizing producer lands — i.e. exactly the deferred follow-up this cycle
    queues — D1 dissolves and D2 goes live in the same commit.
  confidence: 0.85
  source: "cycle-1204/add-inboxbatch-rootcause-rule"
  type: "failure-lesson"
  category: "structural"
  applies_to:
