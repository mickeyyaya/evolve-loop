    - "agents/evolve-builder.md"
    - "agents/evolve-tdd-engineer.md"
    - "agents/evolve-auditor.md"
  failureContext:
    cycle: 1204
    task: "add-inboxbatch-rootcause-rule"
    errorCategory: "reasoning"
    failedStep: "build"
    auditVerdict: "FAIL"
    auditDefects: ["D2"]
  observed:
    - "Builder's explicit method was 'mirrors campaignRule's shape exactly' — shape copied, clamps not"
    - "Both sibling rules carry ceilings/partitions whose in-file comments name the measured incidents that produced them"
    - "The new rule is default-on, so the clamps are load-bearing from the first commit, not from a later opt-in"
    - "Bounding came from an unrelated guard (Classify's per-edge campaign partition) the author did not invoke by design"
    - "19/20 live root_cause-carrying items are campaign-less, so the accidental bound covers the rare case, not the common one"
    - "D1 (prose key ⇒ zero groups) hides D2 (no ceiling) — mutual masking, so tests stay green over both"
  rule: >
    When adding a peer to an existing rule/strategy/policy SET, the acceptance surface is the
    set's INVARIANTS, not the sibling's code shape. Before registering a new member:
    (a) Enumerate every clamp, ceiling, floor, partition and provenance check carried by each
        existing member, and for each one state in the report whether the new member needs it,
        with a reason. In-file comments that name a past incident ("added after 55/61 items
        fused") are the invariant's provenance — a clamp with an incident behind it may not be
        skipped silently.
    (b) A clamp the new member appears not to need because of an UNRELATED guard elsewhere is
        not a design decision — name the guard, state the residual exposure, and prove the
        boundary. Bounded-by-accident becomes unbounded when the unrelated guard moves.
    (c) A new member that is DEFAULT-ON is load-bearing immediately; "we can add the ceiling
        later" is only valid if the member is opt-in until the ceiling lands.
    (d) When two defects in one diff mask each other, fixing either one alone ships the other
        LIVE. Record the ordering constraint explicitly as a dependency between the follow-up
        items — never let the unmasking fix land first.
  why: >
    `DefaultRules()` decides how the whole backlog is grouped, and its output feeds two sinks
    that both matter: the triage LLM's prompt (`RenderMarkdown` → `inbox_batches` →
    `top_n` selection) and the scheduler (union-find clustering → batch composition, ordering,
    `DependsOnPrev` serialization, and per-batch max-weight). An unclamped grouping key
    therefore buys an inbox writer two capabilities at once: serialize an arbitrary number of
    otherwise-parallel lanes, and lift arbitrary low-weight work into the top-ranked batch.
    `.evolve/inbox/` is explicitly untrusted (ADR-0073 clamp-parity, consoleroute.go:29-41) and
    agents can write to it. Every sibling rule in this file already paid for its ceiling with a
    production fusion incident; shipping the third one bare re-opens a class the file's own
    comments document as already-learned.
  preventiveAction: >
    Any diff that registers a new member into `inboxbatch.DefaultRules()` — or into any
    analogous default-on rule/strategy set — MUST include, before green: (1) a report table
    enumerating each existing member's clamps (`campaignRule` → Classify partition guard
    classify.go:66-91; `fileAreaRule` → hubAreaMaxItems=5 / minAreaDepth=2 rules.go:88-108) with
    an explicit need/not-needed verdict and reason for the new member; (2) a group-size ceiling
    mirroring `hubAreaMaxItems` unless the field is a proven partition, plus a TDD RED test
    that constructs a group ABOVE the ceiling and asserts the excess does not fuse (a test that
    only exercises 2-3 item groups cannot distinguish "ceiling present" from "ceiling absent");
    (3) an assertion that per-batch weight cannot be lifted by co-batching — construct one
    low-weight and one high-weight member sharing the key and pin the resulting batch weight;
    (4) if the new member is prose-keyed or has no normalizing producer, register it OPT-IN
    (beside `ConnectsRule`) and not in `DefaultRules()` until the ceiling and the contract both
    land. Auditor: treat "mirrors <sibling> exactly" in a build report as a signal to diff the
    new member against the sibling's GUARDS, not its body.
