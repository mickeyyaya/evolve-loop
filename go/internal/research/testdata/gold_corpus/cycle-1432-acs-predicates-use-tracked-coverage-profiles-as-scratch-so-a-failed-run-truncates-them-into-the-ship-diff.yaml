- id: cycle-1432-acs-predicates-use-tracked-coverage-profiles-as-scratch-so-a-failed-run-truncates-them-into-the-ship-diff
  pattern: "acs-predicates-regenerate-tracked-repo-files-in-place-as-a-side-effect-of-running-so-any-cycle-that-merely-executes-the-regression-suite-rewrites-artifacts-it-never-touched-and-when-the-instrumented-run-produces-no-coverage-the-tracked-profile-is-truncated-to-its-header-and-staged-into-a-shipping-diff-that-declares-removals-none"
  description: >-
    Cycle 1432's shipping diff carries changes to three tracked files no phase
    of the cycle intended to touch and no report mentions:

        go/coverage.router480.txt          568 lines -> 1 line (`mode: set`)
        go/coverage.fleetpolicy464.txt     -881/+352 churn
        go/coverage.fleetpolicy464.func.txt   92 lines churned

    `build-report.md`'s `## Changes` table lists eight paths, none of these, and
    states "**Removals:** none" with `{"removedPaths": []}`. The staged diff
    deletes 568 lines from a tracked file.

    MECHANISM, NOT MYSTERY. The ACS predicates themselves write these paths as a
    side effect of executing. `go/acs/cycle480/predicates_test.go:139-143` shells:

        go test -coverprofile=coverage.router480.txt ./internal/router/ && \
        go tool cover -func=coverage.router480.txt > coverage.router480.func.txt && \
        bin/apicover -enforce -cover coverage.router480.func.txt ...

    with the working directory set to the repo's `go/` root — so the profile is
    not a temp file, it is a TRACKED repo artifact used as scratch space.
    `go/acs/cycle464/predicates_test.go:136` does the same for the fleetpolicy
    pair. Running the regression suite therefore mutates the tree, and every
    cycle that runs `go test -tags acs ./acs/...` inherits the churn. The
    router480 case is the damaging one: that run produced NO coverage rows, so
    the profile was truncated to its `mode: set` header — the checked-in coverage
    baseline for `internal/router` was destroyed and staged.

    THE STAGING IS WHAT MAKES IT SHIP-RELEVANT. The builder attested to
    git-tracking with explicit paths ("no `git add -A`") and that attestation is
    honest — but these files were ALREADY tracked and already dirty, so they ride
    the cycle diff regardless of how carefully the builder stages. Nothing in the
    build's self-check compares the staged diff against the reported `## Changes`
    table, so an unreported deletion of 568 tracked lines reached audit
    undetected by the phase that produced it. The auditor caught it as MEDIUM M1
    by diffing rather than by reading the report.

    WHY THIS OUTRANKS ITS SEVERITY LABEL. It is a silent-corruption channel with
    no adversary and no defect in the code under test: any cycle, on any lane,
    that happens to execute these suites can quietly degrade a tracked coverage
    baseline that later `apicover -enforce` runs read as ground truth. The
    failure is invisible in every report and only visible in the diff.
  confidence: 0.9
