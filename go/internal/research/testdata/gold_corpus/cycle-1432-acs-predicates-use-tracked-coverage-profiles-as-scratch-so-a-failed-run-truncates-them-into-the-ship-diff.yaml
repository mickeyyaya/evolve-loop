    cycle: 1432
    task: "schema-aligned-salvage-layer"
    errorCategory: "tool-use"
    failedStep: "build"
    auditVerdict: "FAIL"
    auditDefects:
      - "MEDIUM M1: unrelated tracked artifacts clobbered inside the shipping diff — go/coverage.router480.txt reduced from 568 lines to the single line 'mode: set' and go/coverage.fleetpolicy464.{txt,func.txt} churned (-881/+352) as side-effect writes from go/acs/cycle464 and go/acs/cycle480 predicates, none listed in build-report.md's Changes table which asserts 'Removals: none'"
    priorOccurrences: []
    upstreamSignals:
      - "the truncated profile contains ONLY `mode: set` — a zero-row coverage profile is self-evidently a failed instrumented run, and nothing inspects that"
      - "the build's `## Changes` table and the actual staged diff are never mechanically compared; the discrepancy is only discoverable by an auditor who diffs"
      - "the git-tracking attestation checks that delivered paths ARE tracked, which is orthogonal to whether UNDELIVERED tracked paths became dirty"
  governingVariable: >-
    Wrong assumption: "a test run does not change the repository, so the diff
    contains what the builder wrote." True relationship: a predicate that shells
    a build/coverage pipeline with the repo root as its working directory is a
    WRITER, and when its output path is tracked, executing the regression suite
    is a mutation of the shipping tree. Careful staging cannot exclude it —
    already-tracked, already-dirty files ride the cycle diff. The invariant that
    actually holds the line is: TEST ARTIFACTS MUST NOT BE TRACKED PATHS, and
    the reported change set must be reconciled against the staged diff by a
    machine rather than by narration.
  preventiveAction: >-
    (1) MOVE THE PROFILES OUT OF THE TRACKED TREE. `go/acs/cycle464` and
    `go/acs/cycle480` must write coverage profiles to `t.TempDir()` (or
    `$TMPDIR`) and pass that path to `go tool cover` / `apicover`. No predicate
    may name a tracked path as an output. Then untrack `go/coverage.*.txt` /
    `go/coverage.*.func.txt` via `git rm --cached` and gitignore them, unless a
    baseline is genuinely needed — in which case it gets a distinct name that no
    test writes.
    (2) RECONCILE THE REPORTED CHANGE SET AGAINST THE STAGED DIFF MECHANICALLY.
    A build-floor check should compare `git diff --cached --name-status` to the
    build report's `## Changes` table + `removedPaths`, and fail the handoff on
    any path present in the diff and absent from the report. "Removals: none"
    beside a −568-line deletion is exactly the claim discrepancy this catches,
    and it is a pure string comparison.
    (3) RESTORE THE TRUNCATED BASELINE BEFORE THE NEXT SHIP.
    `go/coverage.router480.txt` currently holds only `mode: set`; regenerate it
    from a real `internal/router` coverage run (or restore from
    `origin/main`) rather than shipping the truncation.
    (4) A ZERO-ROW COVERAGE PROFILE IS AN ERROR, NOT A RESULT. Any predicate
    that produces a profile whose body is empty must fail loudly at that point
    instead of feeding it onward to `apicover -enforce`, where "no rows" reads
    as "nothing to enforce".
