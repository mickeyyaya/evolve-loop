    cycle: 1285
    task: "land-continuation-defect-ledger"
    errorCategory: "reasoning"
    failedStep: "build"
    auditVerdict: "FAIL"
    auditDefects:
      - "D2 HIGH — deleting continuation-manifest.json disarms the whole reconcile gate: 3 inherited OPEN defects closed, verdict PASS, zero diagnostics (TestRepro1285_F2 x2)"
      - "D3 MEDIUM — case-sensitive self-vouching basename compare on a case-insensitive filesystem (TestRepro1285_F3)"
      - "D4 MEDIUM — closure gate FAILs an honest report that quotes a defect and declares it OPEN (TestRepro1285_F5)"
    upstreamSignals:
      - "cycle-1282's audit DEF-1 already established that the graded agent authors the gate's inputs; the fix covered the disposition path and not the arming path"
      - "three cycles (1279, 1282, 1285) on one inbox item, all FAIL, all reporting recurrence: 0"
  governingVariable: >-
    Wrong assumption: "the prior audit's defect list bounds the attack surface,
    so closing every named input hardens the control." True relationship: an
    audit enumerates what one reviewer reached, and the cheapest remaining bypass
    is always one level OUT from wherever the hardening stopped — most often the
    ARMING condition, because a gate that does not run leaves no evidence that it
    did not run. Ask two questions no defect sentence will ask for you: (a) what
    single file deletion makes this control a no-op, and does that produce a
    diagnostic? (b) for each new strictness, which is more likely — an adversary
    who trips it, or an honest author who does? A control that fails open under
    `rm` and fails closed under accurate prose has both directions inverted, and
    the second one is not merely an availability bug: a gate that punishes honest
    reporting gets routed around, so it self-deletes.
  preventiveAction: >-
    (1) ARM FROM A SOURCE THE GRADED AGENT CANNOT WRITE. Derive continuation
    lineage from `.evolve/continuation-registry.json` (or the orchestrator's
    in-process cycle state), never from a workspace file. If arming must read a
    workspace file, an ABSENT or CORRUPT one has to be as loud as a violation —
    match the existing missing-ancestor-ledger warning at
    `defect_ledger.go:336-344`, and make corrupt-manifest BLOCK, matching the
    treatment `defect-dispositions.json` already gets.
    (2) RUN THE `rm` TEST ON EVERY NEW GATE, AS A COMMITTED PREDICATE. For each
    file the gate reads, delete it and assert the verdict is not PASS-with-zero-
    diagnostics. This is one table-driven test and it would have caught D2 before
    the adversarial reviewer did.
    (3) IDENTITY COMPARISONS MUST MATCH THE SUBSTRATE. Path/basename equality on
    darwin is `strings.EqualFold`, not `==`. Any exact-match security check
    against a filesystem, a URL, or an env var needs an explicit normalisation
    step and a negative case in its casing.
    (4) A TEXT-MATCHING GATE MUST DISTINGUISH USE FROM MENTION BEFORE IT IS
    LOAD-BEARING. `closureClaimOffenders` needs quote and negation awareness, and
    every such gate needs a positive test that an HONEST report passes — not only
    that a dishonest one fails. Half a gate's test surface is its false-positive
    rate, especially for one that grades its own author's future output.
    (5) WHEN CONTINUING A REJECTED CYCLE, TREAT THE DEFECT LIST AS A FLOOR AND
    WRITE DOWN, EXPLICITLY, THE EDGES IT DID NOT COVER — arming, availability,
    concurrency, and substrate assumptions. Then harden those in the SAME pass.
