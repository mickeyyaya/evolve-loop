- id: cycle-1285-hardening-lands-on-the-inputs-the-audit-named-not-on-arming-or-availability
  pattern: "every-input-the-prior-audit-named-is-hardened-while-the-condition-that-decides-whether-the-gate-runs-at-all-stays-in-the-old-trust-class-and-fails-silent-open"
  description: >-
    Cycle 1285 did the hard part right. The six defects cycle 1282's audit named
    were genuinely repaired against the property, not the sentence — the
    trusted-row arm deleted and inherited rows rebuilt from the ancestor every
    pass, `defectID` widened 4 -> 16 bytes with first-row-wins and a blocking
    shadow diagnostic, `evidenceResolves` narrowed to relative-only /
    no-`..`-escape / project-root-only / `Lstat` regular-file / self-record
    rejection, caps that RECORD overflow instead of dropping, and the 1282 PoCs
    promoted into tree-resident locks that each drive `hooks.Classify`. The
    auditor verified all six FIXED (`audit-report.md:52-59`). That is real
    progress and it is the correct answer to
    [[cycle-1282-defect-list-consumed-as-specification-not-as-property]] — which,
    note, was never written to disk (see
    [[cycle-1285-durable-failure-record-is-written-behind-a-precondition-the-failure-trips]]),
    so the lane reached it unaided.

    It FAILed anyway because hardening tracked the SURFACE the prior audit
    pointed at — the disposition inputs — and stopped at the two edges no defect
    sentence had named:

      D2 HIGH  ARMING. `reconcileContinuationDefects` returns `(nil, false)`
        when `continuation.ReadManifest` reports non-continuation
        (`defect_ledger.go:326-327`). Delete `continuation-manifest.json` — a
        file in exactly the trust class the DEF-1 fix concedes is agent-writable —
        and three inherited OPEN defects close with verdict PASS and ZERO
        diagnostics. The mechanism already treats a deleted ANCESTOR LEDGER as
        loud enough to warn about (`:336-344`); the manifest is the cheaper `rm`
        on the same threat model and is silent. Lineage exists out of band in
        `.evolve/continuation-registry.json`, so arming never needed to depend on
        a file the graded agent may delete. And the degrade directions are
        backwards: a corrupt manifest degrades OPEN while an unparseable
        `defect-dispositions.json` BLOCKS.
      D3 MEDIUM  A CASE-SENSITIVE CHECK ON A CASE-INSENSITIVE FILESYSTEM. Rule 4
        (no self-vouching) compares `filepath.Base` exactly
        (`defect_ledger.go:275-278`), so on darwin
        `.evolve/runs/cycle-1255/Defect-Ledger.json` resolves to the gate's own
        record and closes every inherited defect. The rule was right; the
        comparison was stricter than the substrate.
      D4 MEDIUM  THE AVAILABILITY EDGE, FAILING CLOSED AGAINST HONEST AUTHORS.
        `closureClaimOffenders` matches the phrase, not the assertion
        (`closure_claim.go:42-63`), so a report that QUOTES an inherited defect
        and explicitly declares it still OPEN is graded FAIL. The real inherited
        text in this repo contains `'verified closed'`, so this fires on the
        first continuation that does the honest thing — and the gate runs inside
        `hooks.Classify`, meaning it grades every future audit report in the loop.

    The pattern across all three: hardening was applied where the last audit
    looked, and every unlooked-at edge kept its original failure direction —
    silent-open where an adversary acts (D2, D3), fail-closed where a benign
    author acts (D4). That is the worst possible assignment of both.
  confidence: 0.88
  source: "cycle-1285/land-continuation-defect-ledger — audit D2/D3/D4, each executed RED by the auditor via go test -overlay against hooks.Classify"
