  governingVariable: >-
    Wrong assumption: "an eval file at a stable path is a regression gate for the
    slug it names." True relationship: an artifact gates across attempts only if it
    PERSISTS across attempts, and every artifact this pipeline produces for a FAILING
    lane dies with the worktree. Evals therefore have exactly the memory of the
    channel that regenerates them — the inbox item's `fix` text — and inherit its
    shape: a decision spec yields decision criteria and never authorship, execution-root,
    or persistence criteria. The second-order effect is worse than forgetting: the
    eval does not merely omit the hard criteria, it AFFIRMATIVELY CERTIFIES the
    remainder, so a shrinking criteria set converts into a rising green count. Cycle
    1501 scored 4/4 green where 1493 would have scored 4/10, and no signal anywhere
    in the pipeline distinguishes "passed a harder test" from "passed a shorter one."
    The tell is exact and cheap to check: an eval file whose slug has a
    `continuation.cycle` in its inbox item, and whose criteria count is LOWER than
    the predecessor cycle's file at the same path.
  preventiveAction: >-
    (1) LAND THE EVAL BEFORE THE LANE, OR CARRY IT FORWARD BY JOIN. Either evals for a
    slug with a `continuation.cycle` are written to main at mint time (they are
    `.evolve/**`-only, path-filtered out of the Go CI matrix, so landing them is cheap),
    or the TDD phase MUST resolve `continuation.cycle: N`, read the predecessor's file
    at the same path from that cycle's preserved branch, and seed from it. Deterministic
    file join, no LLM, no ranking. Owner: `go/internal/phases/tdd` + the continuation
    adoption site in `go/internal/core/routing_dispatch.go`.
    (2) GATE CRITERION-COUNT MONOTONICITY. When a predecessor eval exists for the same
    slug, block the TDD→Build transition if the new file drops any predecessor criterion
    without an explicit `retired_criterion:` line naming the criterion and the reason.
    Silent deletion is the whole defect; an explicit deletion is a reviewable decision.
    Red-first test pinning the 1501 shape: 7 criteria in, 4 out, transition blocked.
    (3) RESTORE THE FOUR DROPPED CRITERIA VERBATIM before any further attempt at this
    slug — execution-root refusal, absent-evidence-is-not-satisfied-evidence,
    retired-verdict-survives-FreshenSpecs, no-silent-caps — and add the two the chain
    has never had: a timeout bound and an authority clamp on the writer.
    (4) MAKE `evolve eval quality-check` COMPARATIVE, NOT STANDALONE. Its verdict must
    include "criteria retained vs predecessor: N/M" whenever a predecessor exists. A
    quality check that cannot see a deletion certifies the deletion.
    (5) AS AUDITOR: when every cycle grader is green and any defect is CRITICAL, that
    combination is itself a finding about the eval, not only about the diff. Cycle
    1501's auditor did exactly this (M1) — keep it, and raise it above MEDIUM when the
    slug has a `continuation.cycle`.
