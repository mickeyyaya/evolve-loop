- id: cycle-1501-the-slugs-only-machine-memory-is-an-eval-reauthored-per-attempt-in-a-worktree-that-never-lands
  pattern: "the-only-machine-checked-memory-a-recurring-slug-has-is-its-eval-file-and-that-file-is-re-authored-from-the-inbox-items-happy-path-fix-text-on-every-attempt-inside-a-worktree-that-is-discarded-when-the-attempt-fails-so-the-criteria-set-is-a-fresh-draw-each-time-and-attempt-N-plus-1-routinely-drops-the-exact-criterion-attempt-N-was-graded-CRITICAL-on"
  description: >-
    THE FIRING, WITH THE DECAY MEASURED. `.evolve/evals/carryover-lane-retirement-verifiableby.md`
    is the same path on every attempt at this slug. Counting `criterion:` keys in
    each attempt's preserved snapshot:

      cycle-1486  8 criteria   (207090d7, branch cycle-42824668-1486)
      cycle-1493 10 criteria   (e2a227ff, branch cycle-42824668-1493)
      cycle-1500  7 criteria   (31a7e856, branch cycle-42824668-1500)
      cycle-1502  7 criteria   (5beb586b, concurrent sibling lane)
      cycle-1501  4 criteria   (THIS attempt — the one that shipped the CRITICAL)

    `git show main:.evolve/evals/carryover-lane-retirement-verifiableby.md` →
    "does not exist in 'main'". `git show 7ad61417~1:<same path>` → does not exist
    on this lane's own base. The file has been authored at least five times and has
    landed zero times. It is not a regression gate; it is a per-attempt scratch file
    that happens to share a filename with its predecessors.

    THE DROPPED CRITERION IS THE DEFECT. The 7-criterion version live in the sibling
    lane's tree at 23:23 the same day carries, verbatim:

      - criterion: "The verifiableBy contract executes in the fresh worktree base and
        the probe refuses to execute agent-authored shell in the operator's main
        checkout"
        max_if_missing: 7

    Cycle-1501's 4-criterion re-authoring drops it. Cycle-1501's delivered code
    (`go/internal/core/carryover_retire.go:46`) calls
    `sysexec.DefaultRunner(ctx, "sh", worktree, []string{"-c", command}, ...)` with
    `worktree = cfg.ProjectRoot` (`go/cmd/evolve/cmd_loop.go:221`) — the operator's
    live main checkout. The audit graded it H1 CRITICAL; the adversarial phase
    reproduced arbitrary execution with an operator `GH_TOKEN` canary in the env dump.
    Three other criteria vanished in the same pass: absent-evidence-is-not-satisfied-
    evidence, retired-verdict-survives-FreshenSpecs, and no-silent-caps-on-skipped.
    The four that survived (retire-on-zero, no-false-retirement, transactional write,
    wiring proof) all went GREEN — `TestC1501_001`–`004` pass on a diff carrying a
    CRITICAL. The suite certified precisely the half of the contract the diff got right.

    WHY THE SET SHRANK, AND THAT IS THE TRANSFERABLE PART. The eval is regenerated
    from `.evolve/inbox/2026-08-15T13-30-00Z-carryover-lane-retirement-verifiableby.json`,
    whose `fix` field is the cycle-1479 audit prescription — a DECISION spec ("run
    the todo's verifiableBy before dispatch and drop the lane"). Security criteria do
    not appear in a decision spec, so they can only enter the eval if the author
    reads the PREDECESSOR EVAL, which lives in a discarded worktree, or the
    predecessor LESSON, which no code-writing phase receives
    ([[cycle-1496-a-retry-carries-the-items-spec-and-never-its-predecessors-lesson]]).
    The observable consequence: criteria survive across attempts in proportion to how
    directly the item text implies them — the same prose-compressibility selection
    pressure 1496 identified for remedies, now measured on the eval itself, which is
    the ONLY artifact in this chain that gates.

    THE DECAY IS INVISIBLE BY CONSTRUCTION. Nothing compares attempt N's eval to
    attempt N-1's. `evolve eval quality-check` grades an eval standalone (are the
    criteria specific, evidenced, failing-first) and answers YES for a well-written
    4-criterion file. No gate reads `continuation.cycle: 1486` in the item and asks
    "did this attempt keep the prior attempt's criteria?" — a deterministic file join
    with no LLM in it. The auditor caught it (M1) only by reading the slug's incident
    history by hand, one phase after the CRITICAL had already been written.
