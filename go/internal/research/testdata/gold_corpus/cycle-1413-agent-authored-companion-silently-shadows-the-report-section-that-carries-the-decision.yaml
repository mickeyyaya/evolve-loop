- id: cycle-1413-agent-authored-companion-silently-shadows-the-report-section-that-carries-the-decision
  pattern: "triage-wrote-the-retirement-id-in-the-report-superseded-section-and-the-reader-preferred-the-agent-authored-json-companion-which-omitted-that-key-so-the-all-or-nothing-file-preference-discarded-the-strictly-richer-source"
  description: >-
    Cycle-1413's triage did NOT forget to retire the item. `triage-report.md:17-18`
    declares the section verbatim:

      ## superseded (retire an inbox item by id — work already shipped under another id)
      - repocontract-gate-false-red-swallowed-diag: shipped as commit 1cf5bdaf (#413) …

    The deterministic projector parses exactly that section into the array the
    retirement path reads — `go/internal/triagecap/project.go:118-130`
    (`supersededSectionRE` → `d.Superseded []string`). It never ran. Reason:
    `go/internal/phases/ship/postship.go:240-245` (`triageDecisionBytes`) returns
    the agent-authored `triage-decision.json` **the moment the file exists**, and
    only falls through to `ProjectDecisionJSON` when it is ABSENT
    (`postship.go:251`). The authored companion carried keys
    `[committed_floors, cycle, deferred, deferred_floors, dropped, escalate_block,
    phase_skip, skip_rejected, skip_shipped, top_n]` — no `superseded`.

    So the preference is all-or-nothing on FILE PRESENCE, not per-key: writing
    any companion silently deletes every fact the report expressed that the
    companion omitted. Downstream, `inboxmover.SupersededInboxIDs` (inboxmover.go:472-491)
    got nil, `ReconcileSuperseded` iterated an empty list, and
    `inboxmover.CommittedIDs` (outcome.go:165-185) walks ONLY `top_n[].id` and
    `skip_shipped[].task_id` — both `[]`. `dropped` has zero retirement readers
    repo-wide. Verified end state: the item is still in `.evolve/inbox/` root and
    in neither `consumed/` nor `processed/`.

    Compounding deadlock (the reason this cannot self-clear): retirement lives in
    the SHIP phase behind a landed-commit gate (`postship.go:141`,
    `res.CommitSHA != "" && isLanded(...)`). Audit FAILed, so ship never ran, so
    no retirement path executed at all. The lane fails BECAUSE the item is not
    retired, and the FAIL is what prevents retiring it. Next cycle draws the
    identical `lane-scope.json` and reproduces the cycle byte-for-byte — an
    identical-fingerprint respin against the consecutive-failures ceiling (3,
    landed `26690652`).

    The irony is load-bearing: `inboxmover.go:466-467` states this machinery
    exists "replacing the prose-only … carryover instruction that silently lapsed
    for cycles 544..548." The prose was correct this time; the JSON seam ate it.
