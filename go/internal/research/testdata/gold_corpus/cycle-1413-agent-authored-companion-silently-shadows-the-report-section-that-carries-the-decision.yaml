    auditDefects:
      - "D-1 CRITICAL: scoped inbox item not retired — triage-decision.json omits `superseded`; top_n/skip_shipped empty; `dropped` has no retirement reader. Zero code change AND zero queue change."
    upstreamSignals:
      - "triage-report.md:17-18 DOES carry the `## superseded` section with the correct id — the prose channel was right"
      - "premise-challenge Attack 4 falsified the retirement assumption pre-build and named the exact one-key fix (premise-challenge-report.md:148-188)"
      - "premise-challenge already flagged the seam as a general class: 'the projection is all-or-nothing on file presence' (premise-challenge-report.md:216-220)"
  governingVariable: >-
    Wrong assumption: "two writers of the same fact are redundant — if either
    channel carries it, the decision sees it." True relationship: when a reader
    PREFERS one source whole-file over another, the preferred source's omissions
    become deletions of the other source's content. Redundant channels are only
    redundant under a MERGE; under a preference they are a single point of
    failure whose silent mode is the richer source being discarded. The
    invariant: a preference between two sources of the same decision must be
    per-key with a divergence alarm, or one of the sources must not exist.
  preventiveAction: >-
    (1) MAKE THE PREFERENCE PER-KEY. `triageDecisionBytes` must project the
    report FIRST and overlay the authored companion key-by-key, so an authored
    file can add facts (`skip_shipped`, git-verified SHAs — the reason the
    preference exists) but can never subtract a section the report stated.
    Divergence between the two on a shared key must be logged loudly, not
    silently resolved.
    (2) CROSS-CHECK AT THE TRIAGE CONTRACT BOUNDARY. A `triage-decision.json`
    whose report declares `## superseded` (or `## dropped` with
    reason=already-shipped) while the JSON omits the corresponding
    `superseded[]` entry must be REJECTED at the triage phase gate — the phase
    that can still fix it — rather than discovered by audit three phases later.
    (3) `dropped` MUST NOT READ AS RETIREMENT. It has zero retirement readers
    repo-wide; any agent prose asserting that `dropped` retires an entry is
    false. Either wire `dropped` + reason=already-shipped to retirement, or
    forbid the claim in the triage contract.
    (4) A ZERO-TASK CYCLE NEEDS A NON-SHIP RETIREMENT PATH. Retirement gated on
    a landed ship commit is unreachable for a cycle whose only deliverable IS
    the retirement and which therefore fails audit. Give queue-only closeout an
    exit that does not route through ship (operator/console inbox retirement is
    the current escape hatch — scout-report.md:88-90 recommended exactly this).
