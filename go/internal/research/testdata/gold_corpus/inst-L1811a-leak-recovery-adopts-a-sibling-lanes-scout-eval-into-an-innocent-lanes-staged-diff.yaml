- id: inst-L1811a
  pattern: "main-tree-leak-recovery-has-no-authorship-so-a-sibling-lanes-scout-eval-is-relocated-and-staged-into-an-innocent-lane"
  description: >-
    Cycle 1811 (lane router-silent-errors) passed every code predicate yet failed audit H1, because its staged
    diff carried .evolve/evals/phasespec-roots-silent-policy-error.md, the eval of sibling lane 1812's item
    (lane-scope.json for 1811 lists only router-silent-errors). Neither 1811's scout nor its triage ever
    touched that path (scout-events.ndjson and triage-events.ndjson name only evals/router-silent-errors.md).
    Lane 1812's scout wrote it into .evolve/runs/cycle-1812/.evolve/evals/ at 21:28:08. The 1811 worktree copy
    has the same sha1 (ef944560), the same mtime to the second, and an inode 13 above the 1812 file
    (790833725 vs 790833738). That points to a copy into the shared main tree, followed by a rename
    (inode kept) into the 1811 worktree. The likely path is core.recoverBuildLeak (leak_recovery.go:36-140):
    it subtracts a per-lane, cycle-start dirty baseline from `git status -uall` of the ONE shared projectRoot,
    relocates every new untracked path into THIS lane's worktree and runs `git add -f`. It has no notion of
    who wrote the path. This is the same disease as inst-L1537a (where the same attribution gap aborted
    a lane instead of adopting the file). It is the 6th+ instance of shared-tree attribution with zero
    authorship. Corrective check: before you relocate or stage any main-tree path into a lane, match it
    against that lane's provenance (lane-scope todo_ids, or a writer-populated registry like mintregistry).
    For an .evolve/evals/<slug>.md, the slug must be in the lane's own todo_ids or scout Selected Tasks.
    Leave a foreign slug's eval alone.
