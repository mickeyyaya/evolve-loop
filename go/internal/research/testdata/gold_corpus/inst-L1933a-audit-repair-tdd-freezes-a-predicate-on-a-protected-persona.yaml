  preventiveAction: >-
    Before TDD freezes an ACS predicate, check each file the predicate reads
    against guards.ProtectedSurfaceManifest. If one matches, do not write the
    predicate: record that AC as console work in test-report.md. Scout and
    triage must also resolve each path named in the inbox item text (not only
    the declared files list) against the manifest. If the fix surface is
    protected, route the item to the console.
