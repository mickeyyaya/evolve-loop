- id: cycle-1436-relanded-snapshot-graded-as-a-one-line-delta-while-1096-lines-of-its-production-surface-carried-no-behavioural-grader
  pattern: "a-salvage-relanding-splits-the-diff-into-NEW-EDIT-and-LANDED-VERBATIM-and-every-acceptance-criterion-coverage-target-and-grader-attaches-to-the-NEW-EDIT-so-the-1096-relanded-lines-ship-with-reachability-proofs-and-naming-gates-but-no-assertion-on-what-they-OUTPUT"
  description: >-
    Cycle-1436 landed 1740 insertions: one production line changed
    (`isQuotedEcho` `opens || closes` -> `opens && closes`) plus 1096 lines
    cherry-picked verbatim from stranded snapshot `04d3dee1`. The audit FAILed
    on the relanded half, not the edit.

    THE SPLIT. `build-report.md:22-34` labels every file either
    "**new production edit**" (one row) or "landed verbatim" (ten rows). Every
    downstream verification artifact inherited that split:
      - the TDD oracle and predicate 001 pin the one-line fix;
      - the ACs in `test-report.md` are written for the fix;
      - `coverage-gate-report.md` records `salvage_instrument.go` at **100.0%**
        on every changed line — and `cmd_salvage.go:95-106` at **execution
        count 0**.
    The fix was graded to perfection. The command the cycle exists to deliver
    was graded on whether it could be *reached*.

    WHAT THE PASSING GATES ACTUALLY PROVED. Three green signals covered this
    surface and not one of them looks at output:
      - `apicover-enforce` = "46 exported, 46 covered" — a NAMING gate. It
        proves a test mentions and calls each exported symbol.
      - `build-report.md`'s "Caller proof" table — a REACHABILITY gate. It
        proves `registry.go:59 -> runSalvage -> runSalvageReport` is wired.
      - `TestC1436_006_SalvageReportReachableFromCLI` — builds the real binary
        and asserts the `-json` envelope and the unknown-subcommand rejection.
        The default (non-`-json`) human path it drives is never read back.
    Reachable + named + machine-envelope-asserted, and the operator-facing
    default branch — count line, `recoverable-malformed rate: %.3f`, sorted
    `%-16s` per-pattern loop — has zero executions in any test, unit or
    subprocess. Verified this retro three ways: the coverage profile
    (auditor, re-derived), `coverage-gate-report.md:96` (independent), and
    `grep -rn 'recoverable-malformed rate\|by pattern:' --include='*_test.go'`
    over the whole worktree -> **no hit outside comments**.

    NOT A TOOLING GAP. `runSalvageReport(args []string, stdout, stderr
    io.Writer) int` (`cmd_salvage.go:41`) takes its writer as a parameter, and
    the test-amplification phase ALREADY wrote three `bytes.Buffer` tests
    against `runSalvage` — `TestRunSalvage_Amplify_CorruptSidecarIsALoudError…`,
    `…NonexistentProjectRootFailsCleanlyNotPanic`,
    `…UnknownFlagFailsCleanlyWithUsage`. The harness existed and was used, for
    ERROR paths only. Ten amplification tests were written this cycle; none
    asserts a byte of the success output. A ~15-line assertion was available at
    every stage. What was missing was an acceptance criterion naming the
    operator surface, so no phase was obliged to grade it.

    THE COMPOUND. H1 (unvalidated `pattern` printed raw with `%-16s`, forging an
    "ALL CLEAR - rate 0.000 - SHIP" line via `ESC[2K`+CR) renders through
    EXACTLY this untested branch. The auditor's elevation to HIGH turned on that
    compounding — see
    [[cycle-1436-sub-blocking-adversarial-findings-are-outside-the-continuation-disposition-contract]].

    FALSIFIABLE re-attempt check: for any cycle whose diff contains relanded
    snapshot code, at least one AC names the relanded code's OUTPUT (not its
    reachability), and the patch-coverage report shows nonzero executions on the
    default/no-flag branch of every new CLI surface.
