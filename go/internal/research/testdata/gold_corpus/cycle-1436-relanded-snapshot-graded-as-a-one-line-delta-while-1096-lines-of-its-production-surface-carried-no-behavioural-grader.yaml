  governingVariable: >-
    Wrong assumption: "code relanded verbatim from a prior cycle's snapshot
    carries that cycle's verification with it, so this cycle's grading effort
    belongs on the delta." True relationship: snapshot `04d3dee1` came from
    cycle-1407, which **FAILed audit** (`.evolve/runs/cycle-1407/audit-report.md`
    evolve-verdict: FAIL, 4 OPEN ledger defects). Salvage transfers BYTES; it
    cannot transfer an audit PASS that was never issued. A relanding is a
    first-landing for grading purposes, and the size of the *edit* is not the
    size of the *diff being shipped*.
  preventiveAction: >-
    (1) RELANDING GRADES THE WHOLE DIFF. When a cycle relands salvaged or
    cherry-picked code, Scout/TDD MUST write at least one behavioural AC for the
    relanded production surface — not just the new edit. Bind it to the source
    cycle's verdict: if the source cycle FAILed, state in the build report that
    the relanded code is UNAUDITED and enumerate what now grades it.
    (2) DEFAULT-BRANCH RULE FOR NEW CLI SURFACES. Any new `evolve <cmd>`
    subcommand needs an assertion on its DEFAULT (no-flag) human output, not
    only on `-json` / error paths. `runSalvageReport` takes an `io.Writer` — a
    `bytes.Buffer` assertion is ~15 lines. Make it a coverage-gate check:
    zero-execution blocks on a new command's default branch are CRITICAL.
    (3) DO NOT READ NAMING/REACHABILITY GATES AS COVERAGE. apicover
    ("N exported, N covered") and a caller-proof table answer "is it wired?".
    Neither answers "is its output asserted?". Builders must stop citing them
    under a coverage claim; auditors must not accept them as one.
    (4) TEST-AMPLIFICATION MUST COVER ONE SUCCESS PATH BEFORE EDGE CASES. Ten
    amplification tests landed, all on error/edge branches, while the primary
    success output stayed at zero executions. Amplification that never asserts
    the happy path is amplifying around the deliverable.
