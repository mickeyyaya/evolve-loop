    - "agents/evolve-builder.md"
    - "agents/evolve-auditor.md"
    - "go/internal/phases/"
  failureContext:
    cycle: 1399
    task: "salvage-extract-fenced-json-corrected"
    errorCategory: "integration"
    failedStep: "build"
    auditVerdict: "FAIL"
    auditDefects: ["audit-fail-reason.json#1"]
    systemic: true
    priorOccurrences: ["cycle-1320", "cycle-1340"]
  preventiveAction: >-
    (1) WIDEN THE RECORD TO THE DATA IT ACTUALLY HOLDS. `Evidence` must accept
    both a string and a list of strings (decode into `json.RawMessage`, then try
    `string` and fall back to `[]string`, joining with "; "). Multi-file closure
    evidence is the normal case for a defect closed by code + predicate +
    ancestor-predicate; a schema that admits one citation trains producers to
    under-cite or to drift. This is the root-cause fix, not the diagnostic
    polish.
    (2) A MALFORMED GATE RECORD MUST STILL ENUMERATE THE IDS. When the
    dispositions file fails to parse, the gate should fall through to the
    same per-id "(no disposition)" listing it emits when the file is ABSENT,
    and append the parse error — never replace a work list with a type error.
    Today the more conscientious producer gets the worse diagnostic.
    (3) BUILD `continuation-disposition-producer-duty` (0.88, open since
    2026-08-06). Its acceptance criteria already cover injecting the inherited
    ids and the disposition contract into the builder prompt. Add one clause:
    the injected contract must carry the EXACT field types (a literal JSON
    skeleton), not a prose description of them. Three generations of this class
    have now been diagnosed and none produced a producer-side artifact.
    (4) VALIDATE AT WRITE TIME, IN THE PRODUCER'S OWN CYCLE. Any phase that
    writes a machine-parsed gate record should round-trip it through the
    consumer's decoder before the phase reports done. A schema mismatch found
    at build time costs a re-write; found at audit time it costs the cycle.
