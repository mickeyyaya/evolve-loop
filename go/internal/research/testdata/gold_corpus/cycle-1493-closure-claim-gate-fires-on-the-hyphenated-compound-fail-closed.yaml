  governingVariable: >-
    Wrong assumption: "a word-boundary match is the lexical fix, so `\\bclosed\\b`
    implements the prescription." True relationship: `\\b` is defined against
    the WORD-CHARACTER class, and the compounds this gate must survive are
    hyphenated (`fail-closed`, `*-verify-closed`), where the hyphen IS a
    boundary. The prescription named a hyphen-excluding class precisely because
    plain `\\b` is insufficient; implementing the intent instead of the literal
    regex silently dropped one of the two shapes it was written to cover. The
    deeper pattern is the one cycle-1431 already named: every remedy in this
    file has been a patch on a predicate that does no lexical analysis, and the
    weak rung's second conjunct — a same-line cycle reference — was never
    validated against the fact that audit reports cite their own workspace
    path on every evidence line, so it contributes no discrimination at all.
  preventiveAction: >-
    (1) LAND THE REGEX AS PRESCRIBED, HYPHEN CLASS INCLUDED. Replace
    go/internal/phases/audit/closure_claim.go:36 `\bclosed\b` with
    `(?i)(?:^|[^a-z-])closed(?:[^a-z-]|$)` and apply the same class to the
    strong rung's "verified closed". Do not paraphrase a prescribed pattern
    into a shorter one that looks equivalent — `\b` and `[^a-z-]` differ on
    exactly the character these five firings turn on.
    (2) THE CYCLE REFERENCE MUST BE A *PRIOR* CYCLE, IN PROSE. Exclude the
    report's own cycle number and exclude matches that occur inside a path
    span (`.evolve/runs/cycle-N/...`, `go/acs/cycleN/...`). A gate whose premise
    is "asserts a PRIOR cycle's defect is closed" must not arm on a
    self-referential artifact path — today that path is on nearly every
    evidence line, so the weak rung's discriminator is effectively always true.
    (3) PIN ALL FIVE FIRINGS AS TABLE-DRIVEN REGRESSION CASES fed VERBATIM to
    `closureClaimOffenders`, asserting ZERO offenders: cycle-1339's shape,
    cycle-1371 audit-report.md:22, cycle-1428 audit-report.md:39, cycle-1431
    audit-report.md:60, and cycle-1493 audit-report.md:36. Keep the
    cycle-1255-shaped TRUE positive flagged in the same table so the change is
    provably a precision fix. cycle-1431 asked for this table for four firings
    and it does not exist; the fifth firing is the cost.
    (4) ADD A VOCABULARY GUARD FOR DOMAIN COMPOUNDS. `fail-closed` is standing
    repo vocabulary for a safety property. Whatever form the matcher takes, a
    dedicated case must assert that a line containing only `fail-closed`
    produces no offender.
    (5) OWNERSHIP UNCHANGED: audit-gate code is pipeline-integrity,
    console-owned (`feedback_pipeline_fixes_console_first`). The lane graded BY
    this gate must not be the lane that edits it — which is why 1371/1428/1431
    and now 1493 have produced five lessons and one incomplete edit.
