- id: cycle-1493-closure-claim-gate-fires-on-the-hyphenated-compound-fail-closed
  pattern: "the-closure-claim-gates-landed-word-boundary-fix-used-plain-b-instead-of-the-hyphen-excluding-form-its-own-lesson-prescribed-so-closed-still-matches-inside-fail-closed-and-the-weak-rungs-cycle-reference-discriminator-is-satisfied-by-the-reports-own-workspace-path-making-every-audit-line-that-discusses-fail-closed-branches-an-offender"
  description: >-
    FIFTH RECORDED FIRING of the closure-claim false-positive class
    (1339, 1371, 1428, 1431, 1493) — and the first AFTER a fix landed.

    `.evolve/runs/cycle-1493/audit-fail-reason.json` records two blocking
    reasons. The second quotes defect row H3
    (`audit-report.md:36`), whose text is:

      "Inherited defect `d8e3cdca...` is reproduced, **not fixed**: the coverage
       gate FAILs at 75.6% ... The uncovered lines remain the **fail-closed**
       error branches this feature's safety argument rests on. Root cause: the
       **fail-closed** branches (`retire.go:144-161`, `dispatchgate.go:58-72`)
       are reachable only through store-write failure and are not exercised by
       any test."

    That sentence is the exact OPPOSITE of a closure claim. It declares an
    inherited defect reproduced and open, and it is the honest reporting the
    ledger gate exists to reward.

    MECHANICAL REPRODUCTION (the current matchers replayed over the report):
      line 36  strong=false weak=TRUE cited=false
               closedTokens = ["fail-closed", "fail-closed"]
               cycleRefs    = ["cycle-1493"]
      line 108 same shape (the evolve-verdict comment block)
    The ONLY "closed" token on the offending line is inside the hyphenated
    compound **fail-closed**, and the ONLY cycle reference is **cycle-1493** —
    the report's OWN cycle, harvested from its own workspace path
    `.evolve/runs/cycle-1493/coverage-gate-report.md:32-36`.

    WHY THE LANDED FIX DID NOT CLOSE IT.
    cycle-1431's preventiveAction (1) prescribed a specific regex:

      (?i)(?:^|[^a-z-])closed(?:[^a-z-]|$)      <- EXCLUDES the hyphen

    What shipped at go/internal/phases/audit/closure_claim.go:36 is:

      closureClosedTokenRE = regexp.MustCompile(`\bclosed\b`)

    In RE2 `-` is a NON-word character, so `\b` treats `fail-closed` as the
    word `closed` preceded by a boundary. The prescription's whole point was
    the hyphen class — it was written to kill cycle-1371's shape, the task id
    `chain-boundary-binary-refresh-verify-closed`. Replaying the PRESCRIBED
    regex over both offending lines yields `prescribedWouldMatch=false`. The
    fix landed the half that stops `disclosed` (cycle-1431) and dropped the
    half that stops `*-closed` (cycle-1371). Two shapes, one edit, one
    delivered.

    THE SECOND, UNADDRESSED HALF: THE CYCLE-REFERENCE DISCRIMINATOR IS INERT.
    closure_claim.go:52-54 justifies the weak rung on the grounds that a
    same-line cycle reference distinguishes a real bookkeeping claim from prose
    like "the file handle is closed in the deferred cleanup". In an audit
    report EVERY evidence-bearing line carries `.evolve/runs/cycle-<N>/...`, so
    `closureCycleRef` matches on essentially every line the gate reads. The
    discriminator does not discriminate. Worse, the gate's own premise is a
    claim about a **prior** cycle's defect; a SELF-referential path
    (cycle-1493 inside cycle-1493's report) can never be that, yet it is what
    armed the rung here.

    NET EFFECT AND WHY IT WAS NOT CAUGHT SOONER: `fail-closed` is standing
    repository vocabulary — fail-closed design is a stated principle and the
    term appears across evals, gates and personas. Any audit line that names a
    fail-closed branch and cites a workspace path is now an offender. This
    cycle the gate did NOT decide the verdict (EGPS red_count=1 was independent
    and real, see
    [[cycle-1493-amplification-meta-test-guesses-predicate-names-behind-its-own-anti-bias-blindfold]]),
    so the blast radius was bounded exactly as in cycle-1428 — the same luck,
    twice, and cycle-1431 is the recorded case of the luck running out.
