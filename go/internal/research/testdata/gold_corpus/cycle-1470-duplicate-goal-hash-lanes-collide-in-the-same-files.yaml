    auditVerdict: "WARN"
    auditDefects:
      - "lane-scope.json goal_hash 5683159362b3e3dd is identical to peer commit 5738b36a already on main; both lanes edited go/internal/phases/ship/{gitops,manifest}.go concurrently"
      - "lane-scope.json todo_ids [pipeline-defect-pipeline-blocker] resolves to an id with 8 copies in .evolve/inbox/consumed/; triage dropped it as already-resolved-and-consumed and committed top_n: []"
      - "seven phases dispatched against a lane that could only no-op, ending in GIT_FLEET_REBASE_NEEDED (ship-error.json) against the peer that carried its own goal"
      - "ClassifyFleetRebaseCandidate's FleetRebaseAlreadyLanded short-circuit missed a SEMANTIC duplicate (main: splitPorcelainRename; lane: closingQuoteIndex/cutPorcelainRename)"
  preventiveAction: >
    Dedup lanes on goal_hash, not just todo-id. At mint time, reject a candidate lane
    whose goal_hash matches any in-flight sibling or any goal_hash already present in
    main's recent `evolve-cycle: goal=` commit subjects, and fail the mint LOUDLY when
    a lane's todo_ids all resolve to ids under .evolve/inbox/consumed/ rather than
    dispatching a seven-phase lane that can only no-op. Separately, teach the
    fleet-rebase pre-screen a semantic supersession test: when a conflicting peer
    commit carries the SAME goal_hash, classify the candidate as
    FleetRebaseAlreadyLanded (superseded) and route to salvage-and-retire instead of
    burning the full recovery budget on a rebase that cannot converge.
