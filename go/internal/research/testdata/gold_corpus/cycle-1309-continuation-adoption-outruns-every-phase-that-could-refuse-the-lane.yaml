- id: cycle-1309-continuation-adoption-outruns-every-phase-that-could-refuse-the-lane
  pattern: "the-adr0076-continuation-re-seeds-the-worktree-after-triage-so-the-only-phases-with-scope-or-abort-authority-planned-against-a-tree-that-no-longer-exists-and-an-operator-gated-red-rides-in-unscreened"
  description: >-
    Cycle 1309 executed its own task correctly and still could not ship. The
    task was `materialize-crosspoll-debounce-eval` (F3 part a): 4/4 cycle
    predicates PASS, cycle-1258's regression lock restored to green, both evals
    git-tracked past the `.gitignore` boundary, no test weakened. The auditor
    re-ran every claim and endorsed all of it. The lane died on
    `TestEveryGateShapedFileIsProtectedSurface` REDing on
    `go/internal/inboxmover/prescription_gate.go` — a file this lane never
    authored and no cycle may enroll.

    The timeline, from workspace mtimes, is the whole lesson:

      06:07:42  scout-report.md      — planned against a FRESH worktree
      06:10:53  triage-report.md     — ranked against that same fresh worktree
      06:11:25  continuation-manifest.json + prescription_gate.go appear
                (adoptContinuationAfterTriage re-seeds from cycle-1308's
                 snapshot eb1f530d, moves WorktreeBaseSHA to the prior
                 attempt's base, and hands the tree to fault-localization)
      06:53     audit records FAIL on the inherited red

    `adoptContinuationAfterTriage` (`go/internal/core/continuation_stamp.go:216`)
    is deliberately placed after triage — its own comment gives the reason
    (`processing/cycle-N` does not exist earlier), and that constraint is real.
    The defect is that NOTHING re-screens the lane afterwards. Scout and triage
    are the only phases that may change scope or refuse an item; both had
    already finished. Fault-localization, tdd, build, adversarial-review,
    bug-reproduction and audit all ran — roughly 40 minutes of correct work —
    downstream of a tree whose shipping diff had, by construction, a red no
    cycle can clear. Scout's "whole task live-RED" was accurate when written
    and false by build time; the builder had to discover the scope drift itself.

    Note the direction of contamination: the re-seed widens the SHIPPING DIFF to
    25 files including three Go sources from the prior lane, and EGPS is a
    whole-tree gate. Authorship is irrelevant to it. So one operator-gated
    blocker converts every subsequent lane on the item into a guaranteed
    burn, no matter how good that lane's own deliverable is.
