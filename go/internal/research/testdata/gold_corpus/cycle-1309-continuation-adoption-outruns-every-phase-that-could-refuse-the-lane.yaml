      - "verdict-conflict: auditor narrative WARN, two deterministic gates forced FAIL"
    upstreamSignals:
      - "continuation-manifest.json mtime 06:11:25 is LATER than both scout-report.md (06:07:42) and triage-report.md (06:10:53)"
      - "scout-prompt.txt contains zero occurrences of 'protectedsurface' and zero of 'continuation' — the plan predates the tree it was executed against"
      - "build-report.md 'Scope correction inherited from TDD': 3 of 4 acceptance criteria opened pre-existing GREEN because the re-seed had already satisfied them"
      - "third cycle to carry the byte-identical fingerprint audit|gate-block|1ba930c96a8b (1298, 1308, 1309)"
  governingVariable: >-
    Wrong assumption: "the tree a lane executes against is the tree its planning
    phases inspected." True relationship: continuation adoption mutates the
    worktree, the base SHA and therefore the shipping diff AFTER the last phase
    empowered to refuse the lane has exited, so an adopted blocker is
    unrefusable by construction. The invariant: any seam that changes what a
    lane will ship must be followed by a screen with the authority to abort the
    lane — adoption without re-admission is a one-way door.
  preventiveAction: >-
    (1) ADD A POST-ADOPTION ADMISSION SCREEN. Immediately after
    `adoptContinuationAfterTriage` succeeds, run the durable gate the ship
    decision will use (`go test -tags acs ./acs/regression/...`) against the
    re-seeded tree. A red that is present at adoption time is inherited by
    definition; if it is also unclearable in-cycle (its remedy touches
    `guards.IsProtectedSurface` paths), abort the lane THERE — preserve the
    worktree, route the item to console, and free the lane — instead of
    spending six phases on a diff that cannot ship.
    (2) CLASSIFY REDS BY CLEARABILITY, NOT BY AUTHORSHIP. "inherited" is not
    the useful axis; EGPS does not care who typed the file. The useful axis is
    "can a `--class cycle` commit legally remove this red?" Encode it: a red
    whose only remedy intersects protected surface is UNCLEARABLE-IN-CYCLE and
    must terminate lane admission, not merely be reported.
    (3) RE-VALIDATE SCOPE AFTER A RE-SEED. When adoption fires, scout's
    acceptance criteria were written against a different tree. Either re-run a
    scope check (which criteria are now already green?) or mark the scout report
    stale in the workspace so no downstream phase treats it as current — the
    builder should not have to rediscover this by hand.
    (4) NEVER LET ADOPTION SILENTLY WIDEN THE SHIPPING DIFF. The re-seed took
    the diff from 3 files to 25. Log the delta loudly and record it in the
    workspace, so the audit's blast-radius assessment starts from the real
    number rather than the builder's own edit count.
