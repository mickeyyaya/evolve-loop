- id: cycle-1497-build-floor-truncates-go-test-output-to-a-head-that-carries-no-failure
  pattern: "the-build-handoff-floor-reports-tests-fail-and-quotes-the-first-600-characters-of-go-test-output-but-go-test-writes-passing-packages-and-log-noise-first-and-its-fail-lines-last-so-the-rejection-message-names-no-test-no-package-and-no-file-and-three-correction-redispatches-burn-against-evidence-that-literally-shows-ok"
  description: >-
    Cycle 1497's build phase was rejected three times by the review gate. The
    rejection text handed to the Builder each time, verbatim from
    `audit-fail-reason.json` and `build-usage.json.abort_reason`, was:

        enforced package tests FAIL (coverage run doubles as their selfcheck):
        ok  github.com/mickeyyaya/evolve-loop/go/internal/bridge  1.412s  coverage: 93.1% of statements
        fatal: not a git repository (or any of the parent directories): .git
        [orchestrator] WARN worktree provisioning failed ... TestPhaseBoundaryCheckpointer_FiresDuringRunCycle...
        fatal: not a git repository ...
        fata…

    The message asserts FAIL and then quotes an `ok`, a coverage percentage, and
    a stack of `fatal: not a git repository` lines that are ORDINARY LOG NOISE
    deliberately emitted by a passing `internal/core` test into its own temp
    dir. It names no failing test, no failing package, and no file to edit.

    THE MECHANISM IS A BLIND HEAD SLICE.
    `go/internal/core/build_floor_reviewer.go:304-308` does:
    `head := testOut; if len(head) > 600 { head = head[:600] + "…" }`. But
    `scopedCoverFunc` (:357) runs ONE `go test` over ALL enforced changed
    packages, and `go test` streams results in COMPLETION order with each
    package's `--- FAIL:` detail and the terminal `FAIL <pkg>` summary at the
    END. The fastest package here was `internal/bridge` at 1.4s — and it
    PASSED. So the first 600 bytes are structurally guaranteed to be the
    fastest-passing package plus whatever chatter slower tests write to stderr.
    The failure information is always past the cut. The truncation does not
    shorten the evidence; it deletes all of it and keeps only the noise.

    VERIFIED BY RE-RUNNING THE EXACT COMMAND. `go test -count=1 ./internal/core/
    ./internal/phases/runner/ ./internal/bridge/` in the preserved worktree
    reports precisely three real failures, every one of them past byte 600:
    `TestRunCycle_WritesLatestBriefJSON_BoundedAndValid`,
    `TestRunCycle_LatestBriefJSON_OverwritesAcrossCycles` (both
    `internal/core`, from `next_cycle_brief_test.go`) and
    `TestRun_ScoutPhase_ValidBrief_PromptCarriesWarmStartSection`
    (`internal/phases/runner`, from `runner_warmstartbrief_test.go`). All three
    are the TDD phase's intended RED tests. A message naming those three test
    functions would have been immediately actionable; the message actually sent
    was unactionable by construction.

    THE COST IS MEASURED, NOT ESTIMATED. `build-interactions.ndjson` records one
    `salvage` and three `correction_redispatch` entries, every one carrying the
    same evidence-free payload and every one returning `rejected_again`, at
    68987ms + 90439ms + 65525ms. Three full re-dispatches of a `balanced`-tier
    Builder spent on a message that shows `ok`.

    A SECOND, INDEPENDENT TRUNCATION SITS BEHIND IT. The interaction ledger
    stores `Payload` through `neutralize`
    (`go/internal/interaction/interaction.go:180-193`), which calls
    `panetrust.Digest` — a TAIL digest capped at 200 chars. So the ledger's
    record of why build failed four times is the tail of the already-truncated
    head: `"\nfatal: not a git repository (or any of the parent directories):
    .git\nfata…"`. Head-truncate to 600, then tail-truncate to 200: the two cuts
    compose to retain precisely the middle noise and discard both the `ok` and
    the `FAIL`. Forensics on this cycle from the ledger alone is impossible.

    NOTE THE NEAR-MISS THAT MAKES THIS SPECIFICALLY DANGEROUS. `fatal: not a git
    repository` reads exactly like a real infra fault, and the cycle's
    `failure-digest.json` duly classified the whole cycle
    `"pre_class": "infra-error"` with fingerprint
    `build|infra-error|b7caff24ef79`. The truncation did not merely hide the
    cause — it manufactured a plausible WRONG one and propagated it into the
    loop's failure identity, where the recurrence ladder and the failure adapter
    both key on it.
