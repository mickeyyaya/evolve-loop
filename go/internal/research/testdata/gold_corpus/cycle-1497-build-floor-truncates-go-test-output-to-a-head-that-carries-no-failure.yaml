  governingVariable: >-
    Wrong assumption: "the head of a tool's output is a representative sample of
    its outcome." True relationship: `go test` is a STREAMING, COMPLETION-ORDERED
    reporter whose verdict lines are emitted LAST and whose early bytes are
    dominated by whichever package finished fastest — which, in any run that
    contains a passing package, is a PASSING one. Head-truncation of `go test`
    output is not lossy sampling, it is systematic selection FOR the non-failing
    portion. Evidence must be EXTRACTED by matching the reporter's failure
    grammar (`--- FAIL:`, `FAIL\t<pkg>`, `panic:`, `[build failed]`), never
    sliced by offset.
  preventiveAction: >-
    (1) EXTRACT, DO NOT SLICE. In `go/internal/core/build_floor_reviewer.go`,
    replace the `head[:600]` cut at :304-308 with a filter that collects every
    line matching `--- FAIL:`, `^FAIL\t`, `^panic:`, `[build failed]` and
    `^\s+\S+_test\.go:\d+:` (the assertion detail lines), and quotes THOSE —
    with a trailing `(N more)` count if the set is large. Cap by LINE COUNT of
    matched failure lines, never by byte offset into raw output. Regression test
    feeding a fixture where a passing package and 600+ bytes of stderr noise
    precede the real `--- FAIL`, asserting the failing test NAME appears in the
    floor reason.
    (2) NEVER BYTE-TRUNCATE ANY AGENT-FACING REJECTION REASON. Sweep for the
    `if len(x) > N { x = x[:N] + "…" }` shape on tool output across the review
    and floor paths; each site must either extract by grammar or truncate from
    the END (where verdicts live), not the head.
    (3) FIX THE LEDGER'S FORENSIC VALUE. `interaction.neutralize` tail-digests
    to 200 chars, which is correct for untrusted PANE text but destroys
    closed-vocabulary floor reasons. Record structured failure identity
    (failing package + test names) as its own field rather than relying on a
    prose payload that two independent truncations have already gutted.
    (4) TREAT AN UNCHANGING REJECTION PAYLOAD AS A HARD STOP. If two consecutive
    `correction_redispatch` entries carry a byte-identical payload and both
    return `rejected_again`, the correction loop is provably not transmitting
    actionable information — abort the ladder and escalate to console rather
    than spending the third redispatch.
    (5) AS RETRO/AUDITOR: never accept a floor message as the cause. RE-RUN the
    enforced command in the preserved worktree and read the real failures. This
    cycle's `pre_class: infra-error` and fingerprint
    `build|infra-error|b7caff24ef79` are both artifacts of the truncation, not
    of any infra fault.
