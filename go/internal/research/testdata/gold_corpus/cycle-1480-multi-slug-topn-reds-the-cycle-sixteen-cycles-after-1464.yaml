  governingVariable: >-
    Wrong assumption: "a lesson that correctly names its own preventive action
    will cause that action to happen." True relationship: cycle satisfiability
    is `len(top_n) <= builder_slugs_per_report` (= 1), the check is three lines
    of Go at triage exit, and it has now been WRITTEN AS PROSE THREE TIMES
    (1203, 1464, 1480) without once becoming executable. The defect is no longer
    the scope arithmetic — that is fully diagnosed and undisputed by every
    persona that touches it. The defect is that the pipeline has no path from a
    diagnosed structural fault to a gate, so the diagnosis is re-derived at full
    cycle cost on roughly every second cycle. See
    [[cycle-1480-preventive-actions-block-still-has-zero-production-parser-callers]]
    for the mechanism that keeps this from converting.
  preventiveAction: >-
    (1) GATE THE CARDINALITY IN GO, THIS CYCLE, IN CONSOLE. In
    `go/internal/phases/triage/triage.go`, beside the existing
    `protectedTopNViolation` check at :269, assert
    `len(topN) <= 1` (or `<= policy.builder_slugs_per_report`). Surplus slugs
    move to `deferred` / carryoverTodos and MUST NOT receive this-cycle
    predicates. Table-driven test named for cycles 1203/1464/1480. Do NOT file
    this as an inbox item again — inbox filing is what failed twice.
    (2) OR AUTHORIZE MULTI-SLUG DISPATCH FOR REAL: amend
    `agents/evolve-builder.md:94` to permit N slugs and have the orchestrator
    run a build pass per slug. Pick exactly ONE of (1) or (2); the pipeline
    currently has neither, and having neither is the entire defect.
    (3) TDD BINDS PREDICATES TO DISPATCHED SCOPE, NOT TO TRIAGE SCOPE. A
    this-cycle ACS predicate for a slug the build phase is forbidden to
    implement is a guaranteed red. If the TDD package doc names two tasks and
    the builder contract names one, the TDD phase must fail its own handoff.
    (4) AS AUDITOR/RETRO: when every red predicate maps to a non-first-listed
    `top_n` slug, classify as scope-arithmetic in one line and spend zero
    budget on the implementation. Cycle 1480's auditor did exactly this — keep
    it.
    (5) AS TRIAGE, UNTIL (1) LANDS: commit exactly one slug. If two are
    genuinely dependent, list the BLOCKING half first and defer the other.
