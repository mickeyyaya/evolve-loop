- id: cycle-1480-multi-slug-topn-reds-the-cycle-sixteen-cycles-after-1464
  pattern: "triage-commits-two-top-n-slugs-tdd-mints-cycle-wide-predicates-for-both-the-builder-contract-binds-the-first-listed-slug-only-and-egps-requires-red-count-zero-so-the-cycle-is-red-by-arithmetic-before-the-builder-starts-exactly-as-in-1464-and-1203"
  description: >-
    Cycle 1480 failed with `red_count=4` against an EGPS floor of
    `red_count==0`, and three of those reds (006/007/008) belong entirely to a
    task no agent was authorized to implement. This is the SAME composition
    failure as [[cycle-1464-topn-commits-more-slugs-than-one-build-pass-may-implement]],
    which was itself a restatement of cycle-1203. Sixteen cycles later, nothing
    in the pipeline computes the arithmetic.

    The three colliding authorities, re-verified on disk in this cycle:

      1. `triage-decision.json:3-17` commits TWO `top_n` slugs —
         `minted-phase-verdict-contract-unsatisfiable` and `dead-api-sweep`.
         `go/internal/phases/triage/triage.go` gates `top_n` for EMPTINESS
         (`TestRun_EmptyTopN_FAIL`) and for protected-surface paths
         (`protectedTopNViolation`, triage.go:269) — it never gates CARDINALITY.
      2. `agents/evolve-builder.md:94` still reads, verbatim and unchanged:
         "If `## top_n` commits multiple slugs, use the highest-priority
         (first-listed) one." The Builder obeyed it exactly.
      3. `go/acs/cycle1480/predicates_test.go:1-13` — the package doc names BOTH
         slugs — mints predicates 001-005 for slug 1 and 006-008 for slug 2, and
         EGPS grades the whole suite.

    Outcome as arithmetic predicts: `acs-verdict.json` records 006 "PlanJudge,
    NewPlanJudge, JudgeVerdict, parseJudgeVerdict, judgeNoOpinion all still
    declared in go/internal/core/phase_judge.go", 007 "cluster not removed", 008
    "deadcode-refresh-2026-08.md absent". `go/internal/core/phase_judge.go` is
    byte-unchanged; `git diff HEAD --stat` touches only
    `go/internal/phasecontract/`. Three predicates red because the work was
    never dispatched, not because it was done badly.

    EVERY PHASE DIAGNOSED IT AND NONE COULD ACT. The builder named it in
    Discoveries #2 at confidence 0.97 ("The native cycle suite includes
    dead-api-sweep predicates although the Builder contract selects the first
    top_n slug", `build-report.md:79`) and again in §If Failed. The auditor
    reached it independently as defect H1 and marked `delivery-fidelity |
    incoherent` in its chain (`audit-report.md:126`). Both were correct, both
    were downstream of the decision, and neither has write access to the
    persona contract that caused it.

    THE FREQUENCY IS THE POINT. Of the 30 most recent cycles with a
    `triage-decision.json`, 17 committed 2 or more `top_n` slugs (1445=2,
    1448=4, 1452=11, 1453=2, 1455=2, 1457=2, 1460=62, 1462=2, 1463=4, 1465=6,
    1467=2, 1468=2, 1469=5, 1472=2, 1473=4, 1474=6, 1478=2, 1479=3, 1480=2).
    This is not a rare collision; it is the majority mode of triage, and every
    one of those cycles was red-by-construction unless TDD happened to scope its
    predicates narrower than its own package doc.
