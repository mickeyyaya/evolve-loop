    auditDefects:
      - "H1 (HIGH): delivered tree RED, ACS red_count=1, AC2 undelivered — the red is the post-build reproducer"
      - "M1 (MEDIUM): build-report.md self-verification describes a file rewritten 12 minutes after the report was written"
    upstreamSignals:
      - "inst-L1541a preventive action (1) 'score post-build predicates in their own bucket' — filed, never implemented"
      - "inst-L1546c preventive action (2) 'bug-reproduction MUST write its reproducer to a quarantined build-tagged path the EGPS red_count does not grade' — filed, never implemented"
      - "the router skipped pre-audit-evidence-check, whose own when_to_use names this exact trigger: 'when recent cycles FAILed audit on ... EGPS red_count rather than on code quality'"
  preventiveAction: >-
    (1) PROVENANCE-SCOPED red_count (escalated third filing of inst-L1541a(1)).
    Stamp every predicate/test result in `acs-verdict.json` with the phase that
    authored the file, and compute the EGPS floor over BUILD-TIME predicates only.
    Post-build reds become `carried_findings` in the verdict — surfaced loudly,
    carried to the next cycle, but NOT the ship floor. A cycle whose only red was
    minted after its last writer exited is a cycle that FOUND a defect, not one
    that SHIPPED one; the verdict must be able to say so.
    (2) HASH-FENCE THE SELF-VERIFICATION BLOCK. On build completion, record
    `sha256` of every top_n target file. Any later phase that changes one MUST
    invalidate `build-report.md`'s Self-Verification block (rewrite it to
    "STALE — <file> changed at <ts> by <phase>") and re-run the cycle's ACS slice,
    stamping the new result. One hash per target file; catches the whole
    stale-vouching class that no persist-before-quote rule can reach.
    (3) GIVE THE LOOP A REPAIR RUNG AFTER bug-reproduction. When
    `repro.failing == true` AND the reproducer touches a top_n target file, route
    to a bounded build-repair attempt (or `merge-to-main-gate`'s sibling) BEFORE
    audit, instead of the unconditional `spine:audit` hop. Absent that rung, the
    third-best outcome (find + fix) is unreachable and the loop can only choose
    between blind-green and honest-red.
    (4) EVALUATE THE OPTIONAL-PHASE when_to_use TEXT AT THE SPINE HOP.
    `pre-audit-evidence-check`'s selection criterion already matches this cycle
    verbatim and the router skipped it as `spine:audit`. A spine transition must
    still evaluate optional-phase predicates, or those descriptors are decoration.
    TESTS: (a) a red authored after the build phase's completion timestamp ->
    EGPS reports `carried_findings=1, red_count=0`; (b) a post-build write to a
    top_n file -> build-report self-verification is rewritten STALE and named;
    (c) repro.failing on a top_n file -> routing emits a repair phase, not
    `spine:audit`; (d) an optional phase whose when_to_use matches at a spine hop
    is offered, not silently skipped.
