    errorCategory: "planning"
    failedStep: "build"
    auditVerdict: "FAIL"
    auditDefects:
      - "Builder implemented triage-deferred, out-of-fleet-scope task; triage-report.md ## top_n committed ZERO tasks to this lane"
      - "Shipped diff has no eval: .evolve/evals/fix-tracked-binary-and-untrack-acs-artifact.md does not exist"
      - "No committed regression test: TDD deleted go/acs/cycle577/predicates_test.go (TestC577_*) per empty top_n; fix change is unguarded, violating tests-first standing rule"
      - "Fleet-scope lane isolation crossed: triage deferred to a concurrent lane, risking merge conflict / double git-rm at land"
  preventiveAction: >
    STOP re-emitting the soft instinct (proven insufficient 5x). Two concrete, testable
    implementation changes, both deferred by 522 and 575 and NEVER built:
    (1) EDIT THE TEMPLATE (config, per phases_are_config_only / phase_settings_from_config_not_code):
    In `agents/evolve-builder.md`, change the task-source binding at lines 24, 75, 76 so the
    Builder reads its committed task from `triage-report.md ## top_n` FIRST (scout-report
    remains the source of the task's DETAIL — eval graders, targetFiles — but triage `## top_n`
    is the authority for WHICH slug is in scope this cycle). Add the explicit empty-top_n
    contract: "If `## top_n` is empty, produce a no-op build-report; do NOT substitute scout
    `## Selected Tasks` or triage `## deferred`." The auditor's eval/slug check keys off the
    committed slug — with the fix, an in-scope slug always has a matching eval.
    (2) BUILD THE DETERMINISTIC TASK-AUTHORITY GATE (the one 522 and 575 both asked for and
    that was never built): at build-phase entry, compare the build-report `## Task:` slug
    against triage `## top_n`; a slug absent from top_n (scout-only, triage-deferred, or ANY
    slug when top_n is empty) is a hard commitment violation that BLOCKS before code is
    written. Route empty `## top_n` to a clean NO-OP skip. Additionally: the coverage-gate/audit
    already DETECTS the TDD-slug vs Builder-slug divergence but only WARNs — that divergence
    must BLOCK. Treat "all execution phases bind to triage `## top_n`; empty == no-op" as a
    hard, phase-agnostic invariant enforced in code, not prose.
