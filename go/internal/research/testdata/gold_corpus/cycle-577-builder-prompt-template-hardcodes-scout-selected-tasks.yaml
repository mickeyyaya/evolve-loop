- id: cycle-577-builder-prompt-template-hardcodes-scout-selected-tasks
  pattern: "builder-prompt-template-binds-task-source-to-scout-selected-tasks-not-triage-topn"
  description: >
    SYSTEMIC RECURRENCE — 5th occurrence (282 -> 310 -> 522 -> 575 -> 577) of "an
    execution phase binds to scout's `## Selected Tasks` instead of triage's committed
    `## top_n`," and a NEAR-EXACT REPEAT of cycle 575 (same task: the tracked 18MB
    `go/acs/cycle536/evolve` binary; same empty-`top_n` case; same Builder-builds-anyway
    outcome). The prior lessons (cycle-522, cycle-575) diagnosed the Builder and
    recommended, as their #1 preventive action, "the Builder prompt MUST open
    `triage-report.md ## top_n` FIRST and bind to a committed slug; empty top_n = no-op;
    never substitute scout `## Selected Tasks`." Cycle 577 exposes WHY that never worked:
    the recommendation was only ever emitted as a failure-lesson into `instinctSummary`
    CONTEXT — it was never applied to the actual Builder prompt TEMPLATE. The template
    `agents/evolve-builder.md` still says the OPPOSITE, verbatim:
      - line 24: "`task`: specific task to implement (from scout-report.md ...)"
      - line 75: "Read task from `workspace/scout-report.md`"
      - line 76: "The `## Task: <slug>` line ... MUST be the exact `Slug:` of the task you
        implement, copied verbatim from the scout-report's `## Selected Tasks`."
    The word `top_n` and the string `triage-report.md` appear NOWHERE in the build prompt
    (verified: `grep -in 'top_n|triage-report' build-prompt.txt` -> only boilerplate).
    So the 5 recurrences are the DETERMINISTIC output of a template that hard-codes the
    wrong task authority — no amount of instinct-summary injection can override a prompt
    that explicitly instructs "copy the slug verbatim from scout's Selected Tasks." In
    cycle 577 triage committed EXACTLY ZERO tasks (this fleet lane's `fleet_scope` id
    `builder-handoff-extinct-deterministic-changedpkgs` matched no scout candidate) and
    explicitly DEFERRED `fix-tracked-binary-and-untrack-acs-artifact` with
    `defer_reason=out of this lane's fleet_scope (another concurrent lane owns it; avoid
    duplicate work)`. TDD correctly wrote zero predicates and `rm -rf`'d its draft
    `go/acs/cycle577/` eval. The Builder, following its template, pulled the deferred slug
    from scout's `## Selected Tasks` and built it. The code is genuinely good and self-
    tested, but it ships bound to NO committed task, with NO `.evolve/evals/<slug>.md`, NO
    committed regression predicate (TDD had deleted them), and it crosses fleet-lane
    isolation (duplicate `git rm --cached` / `.gitignore` edit risk with the owning lane).
    META-LESSON: a preventive action that requires a PROMPT/CONFIG or CODE change but is
    delivered only as a soft instinct will recur indefinitely. The fix class is not "re-emit
    the instinct a 5th time" — it is to EDIT THE TEMPLATE and BUILD THE GATE.
    CHECK: The Builder's task authority is `triage-report.md ## top_n`, NOT scout
    `## Selected Tasks`. Open `## top_n` FIRST. If it is empty, the build phase is a NO-OP —
    do not pull from scout `## Selected Tasks` or triage `## deferred`. TDD's RED set is the
    ground truth; an empty RED set == nothing to build this cycle.
  confidence: 0.95
  source: "cycle-577/fix-tracked-binary-and-untrack-acs-artifact"
