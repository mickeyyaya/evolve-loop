  preventiveAction: >
    Make the two authorities ONE, and make disagreement fatal rather than arbitrary.
    (1) DEFINE THE PRECEDENCE IN CODE, NOT PER-AGENT: at continuation adoption
    (go/internal/core/continuation_stamp.go registerLaneScopeBinding / adoption), assert the
    continuation-bound task is a MEMBER of the lane's own lane-scope.todo_ids. If it is not,
    REFUSE THE BINDING LOUDLY (abort_reason, lane re-provisioned) — never silently retarget
    (the 1536 direction) and never silently strand it (the 1543 direction).
    (2) A CONTINUATION MANIFEST WHOSE ANCESTOR DISPOSITION SAYS routing=carryover WITH
    salvage.worktree_has_value=true IS ITSELF AN AUTHORIZATION: triage must be permitted to
    commit the named inherited defect ids into top_n, and the empty-top_n branch must first
    check for adoptable carryover before concluding "no eligible task". Cycle-1539's
    disposition named the exact remaining work ("H2 is a one-line constant swap to
    swarm.tmuxSocketDir()'s /tmp fallback and H1 is adding the three guards from
    autorespond.go:400-427") and no phase in cycle-1543 was allowed to read it as a task.
    (3) The fleet partition must compute overlap from the EFFECTIVE scope (continuation
    resolved), not the declared pin.
    TESTS: (a) manifest task NOT in lane-scope.todo_ids -> adoption returns a refusal with
    both values named, lane does not run; (b) ancestor disposition routing=carryover +
    worktree_has_value=true -> the inherited defect ids appear in the triage candidate set and
    an empty top_n is a hard error; (c) negative control: manifest task IS in todo_ids ->
    adoption unchanged.
