  preventiveAction: >-
    TWO MECHANICAL CHECKS, both cheap enough to be unconditional.
    (1) TERMINAL-WITNESS LENS (audit + builder self-verification): when a diff
    adds a field to a request/response envelope, the phase MUST name the
    terminal WRITER and the terminal READER by file:line. Run
    `grep -rn '<FieldName>' --include='*.go' internal/ cmd/ | grep -v _test.go`
    and count non-declaration references per side. One reference on a side means
    that side has no terminal — that is dead plumbing and blocks PASS, no matter
    how green the suite is. This is the check that would have taken two greps in
    cycle 1564.
    (2) BIND THE PREDICATE AT THE OUTERMOST SEAM THE CRITERION NAMES, NOT THE
    SEAM YOU BUILT. AC1 said "retry dispatches CARRY --resume", which is an ARGV
    fact, so the predicate belongs where argv is built:
    `internal/bridge/engine.go:435-436` already turns a BridgeRequest field into
    a flag (`if req.SessionName != "" { args = append(args, "--session-name="+...) }`)
    and is the sole precedent. Assert the BUILT LAUNCH ARGV contains
    `--resume=<id>` for a BridgeRequest carrying ResumeSessionID, and that it is
    ABSENT when the field is empty. A predicate that a fake in-process runner can
    satisfy is not evidence about production; if the only way to green a row is a
    hand-built probe that manufactures the value under test, the row is testing
    the probe.
    NEVER accept a criterion whose evidence column reads "no measurement" — AC2
    ("measured input tokens on retried phases drop vs baseline") had no baseline,
    no measurement and no eval row, and a criterion with no citation FAILS for
    that criterion.
