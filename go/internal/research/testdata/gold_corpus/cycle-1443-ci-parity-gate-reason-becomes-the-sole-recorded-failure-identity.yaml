  governingVariable: >
    Wrong assumption: "the loudest blocking reason is the cycle's failure." True
    relationship: BLOCKING and IDENTIFYING are different jobs, and a system that
    conflates them will always record the wrong thing when two failures
    co-occur, because the blocker that fires first is systematically the cheap
    infra one (a gate subprocess) while the expensive, informative one is the
    agent's graded judgement. Blocking must be a MAX over reasons; identity must
    be a UNION of them. Wherever the two are computed by the same line, every
    co-occurrence silently discards the more valuable half — and it discards it
    in the same direction every time, so the corpus of remembered failures
    drifts toward infra noise while real defect classes go uncounted and their
    recurrence counters stay at zero.
  preventiveAction: >
    (1) `audit-fail-reason.json` must carry EVERY error-severity reason,
    including the agent-graded verdict reason with its distinguisher, whenever
    the auditor's own sentinel is FAIL — regardless of whether a CI-parity gate
    also overrode. The gate reason may stay first (blocking order is fine); it
    may not be alone. This is a union, not a ranking.
    (2) The failure fingerprint must be computed from the reason set that
    includes the agent-graded defect, so `pre_class` reflects the substantive
    failure when one exists. A cycle that has BOTH an infra red and a graded
    defect is not "infra-error, recurrence 0".
    (3) Add a regression test at the composition point: audit returns a FAIL
    sentinel with defects AND a CI-parity gate returns offenders ⇒ assert both
    strings are present in the persisted reasons and that the digest's pre_class
    is not `infra-error`. Cycle-1424 proved this class once; without a test it
    will recur through whichever gate is added next.
