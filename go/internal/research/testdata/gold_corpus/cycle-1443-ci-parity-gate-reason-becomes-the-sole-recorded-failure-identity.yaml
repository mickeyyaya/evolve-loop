- id: cycle-1443-ci-parity-gate-reason-becomes-the-sole-recorded-failure-identity
  pattern: "an-infra-class-gate-reason-is-the-only-line-written-to-audit-fail-reason-json-so-the-auditors-agent-graded-defect-never-reaches-the-failure-fingerprint-and-the-cycle-is-remembered-as-first-occurrence-infra-error-while-its-real-defect-is-a-named-reproducible-three-string-fix"
  description: >-
    SECOND OCCURRENCE of the class proven in cycle-1424
    ([[cycle-1424-optional-phase-infra-timeout-outranks-and-masks-a-critical-verdict]]).
    Same shape, different gate, and the recurrence is what makes it systemic
    rather than an accident.

    WHAT THE AUDITOR CONCLUDED. `audit-report.md` returns
    `<!-- evolve-verdict: {"phase":"audit","verdict":"FAIL",
    "failure":{"class":"code-audit-fail","defects":["HIGH H1: …score_cap
    evidence commands…match zero tests…"]}} -->` — one HIGH defect, reproduced
    by commands the auditor ran, with a three-string prescription and the
    sentence "Fix the three test-name strings … and this ships."

    WHAT WAS RECORDED. `audit-fail-reason.json` contains exactly ONE reason and
    it is the integration-tier gate's 13 tmux offenders. H1 is absent — not
    truncated, absent. `failure-digest.json` is
    `{"cycle":1443,"fingerprint":"audit|infra-error|23de5a6b79bd",
    "pre_class":"infra-error","recurrence":0}`. Compare cycles 1436/1441/1442,
    where no CI-parity gate fired: each recorded
    `"phase audit verdict FAIL routed to retro (agent-graded; …) defect=H1 …"`
    and fingerprinted as `audit|verdict-fail|…`. The gate reason does not merely
    rank first — it is the whole record, and it changes the failure's CLASS.

    THE CONSEQUENCE CHAIN, EACH LINK REAL. (a) The blocker breaker and the
    identical-fingerprint reset path key on the fingerprint, so a recurrence of
    the eval-vacuity defect will not accumulate against this cycle. (b)
    `recent-outcomes.md` and next-cycle recall will present 1443 as an
    infra-error, so a continuation lane is pointed at the tmux tier instead of
    at three strings in one eval file. (c) The pre-class steers the failure
    adapter and the S3 router toward infra handling for a cycle whose
    substantive result is a task-level, one-file, fully-prescribed fix. (d) The
    genuinely important observation — the eval-vacuity class recurring after
    ADR-0084 — survives only because a retro read the audit report; nothing
    machine-readable carries it forward.

    MECHANISM. Both signals exist and both are already error-severity
    diagnostics; they simply do not co-exist in the reasons list. The gate path
    (`audit.go:321-347`, `applyCIGate` → `overrode(name)`) writes an error
    diagnostic and overrides the verdict; the agent-graded path composes its own
    reason via `core.agentGradedFailReason` (`failure_digest.go:419-427`), which
    exists precisely to add a per-failure DISTINGUISHER because a constant
    fallback once collided different tasks. When a gate overrides, that
    distinguisher is never composed — the very defect identity the fingerprint
    machinery was built to preserve is dropped at the one moment two failures
    are in play. Note the code one layer down is already careful in the opposite
    direction: `core.fingerprint` normalizes `narrative=<verdict>` out of the
    hash so one defect cannot split into three buckets. The asymmetry is the
    bug: identity is protected against SPLITTING and unprotected against
    ERASURE.

    WHY THIS ONE IS WORTH A DEDICATED LESSON RATHER THAN A NOTE. Cycle-1424's
    prescription was written, filed, and the class recurred 19 cycles later
    through a completely different gate. That is the signature of a defect in a
    SHARED reason-recording seam, not in either gate.
