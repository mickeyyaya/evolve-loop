    - "agents/evolve-adversarial-reviewer.md"
    - "agents/evolve-scout.md"
  failureContext:
    cycle: 1425
    task: "retro-disposition-completion-cutoff"
    errorCategory: "reasoning"
    failedStep: "build"
    auditVerdict: "FAIL"
    auditDefects:
      - "HIGH D1: a missing contracted sibling now burns ~600s and terminates the phase with ExitArtifactTimeout, discarding a delivered report — the finality concession that was supposed to prevent this is unreachable from the give-up path"
      - "MEDIUM D3: the ReviewPause nudge and both give-up diagnostics name only cfg.Artifact, so the phase's one self-heal attempt asks for a file already present and operator triage has no 'sibling missing' bucket"
    upstreamSignals:
      - "the build report's own Risk (b) named exactly this — 'a gate that never settles converts the teardown race into an artifact timeout on every retro' — and closed it by citing the finality short-circuit without checking that the give-up path reaches it"
      - "Discovery Scan #1 identified that a misplaced sibling reads as permanently absent, and the risk was recorded as a follow-up rather than as a blocker on the gate being landed"
  governingVariable: >
    Wrong assumption: "making a missing deliverable detectable is strictly an
    improvement, because before it was silently lost." True relationship: a
    detector that BLOCKS is not a detector — it is a new liveness dependency on
    whatever produces the thing detected, and its failure mode is the product of
    two probabilities the old design never multiplied: P(producer misses) x
    cost(blocked). When the producer is an LLM agent following a prompt directive,
    P(miss) is not small and is not controlled by this codebase. The tell is that
    the guard was justified entirely by the FAILURE it prevents (a lost file) and
    never priced against the failure it CREATES (a stalled phase), and the
    degradation path that would have equalized them existed but was proven on the
    unit rather than on the path — see
    [[cycle-1425-test-manufactures-the-precondition-so-the-producing-hop-is-never-executed]].
  preventiveAction: >
    (1) PRICE THE BLOCK BEFORE LANDING IT. Any change that adds a term to a
    completion/readiness predicate must state, in the build report: what produces
    the new term, what happens when it never arrives, how long that costs, and what
    the operator sees. "It degrades gracefully" is a claim requiring the reachability
    proof of preventive action (3) in the sibling lesson, not a sentence.
    (2) DEGRADE, THEN ESCALATE. A conjunctive wait must have exactly one terminal
    outcome for a missing non-primary term: complete with the primary and record the
    miss loudly (partial deliverable + a WARN naming the absent file). Never a
    timeout that discards what DID arrive. Delivered work is never destroyed by the
    absence of an addendum.
    (3) A GATE ON AGENT COMPLIANCE NEEDS A SELF-HEAL THAT NAMES THE MISS. If the
    only remediation channel (the ReviewPause nudge) names the primary, the gate can
    detect a state it cannot possibly repair. Thread the missing path's identity out
    of the observer and into the nudge and both diagnostics before the gate blocks
    on anything.
    (4) BEFORE GENERALIZING, RE-PRICE. `audit` writes two deliverables and declares
    one; extending `AdditionalArtifactNames` to it is a one-line change that
    inherits this exact failure mode. Do not widen the declared set for any phase
    until (2) and (3) hold.
