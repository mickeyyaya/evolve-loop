- id: cycle-1425-conjunctive-liveness-gate-amplifies-the-failure-it-was-built-to-absorb
  pattern: "converting-an-advisory-postcondition-into-a-blocking-precondition-turns-a-previously-inert-agent-compliance-miss-into-a-timeout-that-destroys-the-work-that-did-arrive"
  description: >-
    The task was real: the completion detector watched exactly ONE path
    (`cfg.Artifact`), so the tmux session was torn down the instant
    `retrospective-report.md` settled and the retro's second contracted write,
    `disposition.json`, was lost. Cycles 1382-1398 produced no disposition at all.
    The fix made the detector wait for the WHOLE required set.

    That change converts a liveness-NEUTRAL predicate (one file settled) into a
    CONJUNCTIVE one (N files settled), and conjunctive predicates fail closed. Pre-
    diff, an agent that skipped `disposition.json` cost nothing — the phase exited
    OK with a partial deliverable. Post-diff the sibling is a hard liveness
    dependency: `observeRequired` returns `whole=false` on every tick, the
    stability window resets forever, the phase burns two 300 s review intervals
    (`tmuxArtifactTimeoutS`, `driver_tmux_repl.go:41,431-433`), and exits 81 →
    `VerdictFAIL` with the delivered report discarded unread. `ErrArtifactTimeout`
    is retryable (`core/retry_backoff.go:62`), so wrapped call sites re-pay the
    ~600 s, and repeated retro FAILs feed the standing 3-consecutive-FAIL HALT
    rule.

    The trigger does not require an attacker. Three ordinary events reach it: an
    agent that skips the second write; an agent that writes it to the worktree root
    instead of the workspace (`artifactLocate`'s fallback search is primary-only —
    the builder itself flagged this as Discovery Scan #1, so a MISPLACED sibling is
    indistinguishable from an absent one); or routing retro to a CLI family whose
    persona never carried the write-order directive added in `3ea44496`. The design
    DID have a degradation path — the finality short-circuit — and it was
    unreachable from the give-up branch, which is what turned a designed-partial
    into a guaranteed-total loss. Both reviewers reached the same summary
    independently: this is strictly worse than the bug it fixes. The old bug lost
    `disposition.json`; this loses the disposition, the report, and the cycle.
  confidence: 0.85
  source: >
    .evolve/runs/cycle-1425/adversarial-review-report.md F1 (threat model rows T2/T4,
      the five-step trigger, the cycle-283 cost precedent) and its Verdict
    .evolve/runs/cycle-1425/audit-report.md D1 and "Blast Radius & Convergence" —
      artifactDetector is the completion strategy for EVERY tmux-driven phase
      (newCompletionDetector, completion.go:92-99); the empty-set path is provably
      inert today, so D1's failure mode is inherited by any future phase that
      declares a second deliverable
    .evolve/runs/cycle-1425/build-report.md Discovery Scan #1 (fallback search is
      primary-only) and #2 (audit already writes two deliverables and declares one —
      the same generalization would inherit this failure mode)
    .evolve/instincts/lessons/cycle-283-codex-usage-limit-stalls-phase-to-artifact-timeout.yaml
      — the corroborating cost model (nudge → no_effect → interval x attempts → exit 81)
