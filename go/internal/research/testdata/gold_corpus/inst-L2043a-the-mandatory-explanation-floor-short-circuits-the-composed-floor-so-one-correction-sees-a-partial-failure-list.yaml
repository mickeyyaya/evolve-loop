- id: inst-L2043a
  pattern: "the-mandatory-explanation-floor-short-circuits-the-composed-floor-so-one-correction-sees-a-partial-failure-list"
  description: >-
    Cycle 2043 (cycle-spend-limit-stop-and-handoff). mandatoryExplanationReviewer.Review
    (go/internal/core/reviewer.go:68) returns the explanation floor rejection before it
    runs the composed floor (size ratchet, apicover naming, repo contract). The first
    rejection told the builder about 1 failure (Changed Areas did not explain doc.go).
    The single correction (max=1) fixed only that. The re-review then ran the composed
    floor and found 2 failures that were in the diff from the start: the size ratchet
    on Policy.WorkflowConfig (82 > base 81) and 4 unnamed exports in internal/policy.
    No correction budget was left, so the build aborted with a FAIL verdict. The
    evolve selfcheck build probe uses WholeBuildHandoffFloor and reports all failures
    together, so the live reviewer chain and the self-check disagree on the failure list.
  confidence: 0.85
  source: "cycle-2043/cycle-spend-limit-stop-and-handoff"
  type: "failure-lesson"
