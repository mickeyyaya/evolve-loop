  pattern: "a-floor-scanner-fix-in-the-lane-cannot-unblock-the-lane-that-trips-it"
  description: >-
    SYSTEMIC (third case of a gate compiled into the host binary that grades
    the lane which repairs it: cycle-1340, inst-L1841a, 1965). Cycle 1965 TDD
    added the fixture go/internal/handoff/request/testdata/cycle1950/predicates_test.go
    (a verbatim copy of the cycle 1950 ACS predicates, `//go:build acs`) as data
    for request.TDDBuild. The build handoff floor derives "added test packages"
    with addedtests.Groups. That function selects every added go/**/_test.go
    file and does not skip testdata directories. Thus the floor ran
    `go test -tags acs ./internal/handoff/request/testdata/cycle1950`, and the
    fixture predicates failed (commitsFullyLanded, clearActiveWorktree at 0.0%).
    `go test ./...` skips testdata, so every lane-side check was green. Build
    correction 2 fixed addedtests.go (isTestdata, line 145) in the worktree. The
    floor runs in the orchestrator process from go/bin/evolve, built at
    2026-10-19 14:36 before the cycle, so the fix could not change the result.
    The second rejection used up the correction budget. Wrong assumption: a
    lane can repair the floor that grades it in the same cycle.
