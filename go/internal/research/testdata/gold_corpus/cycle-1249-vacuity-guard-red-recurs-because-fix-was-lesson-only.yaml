- id: cycle-1249-vacuity-guard-red-recurs-because-fix-was-lesson-only
  pattern: "identical-nonhermetic-vacuity-guard-red-blocks-ship-again-because-the-prescribed-two-line-diagnostic-fix-was-only-written-to-a-lesson-and-the-recurrence-counter-keys-on-the-per-cycle-predicate-name"
  description: >-
    Cycle 1249 was blocked by EGPS `red_count=1` on
    `cycle1249/TestC1249_002_DebounceReachableFromProductionWaitLoop`. The
    inner failure is byte-for-byte the one that blocked cycle 1236 thirteen
    cycles earlier:

      completion_debounce_test.go:290: reviewer ran 0 time(s): the loop
      completed before the artifact could churn, so this test did not exercise
      what it claims

    Same inner test (`TestRunTmuxREPL_ArtifactDebounceWiredIntoWaitLoop`), same
    branch (the `rev.calls < 2` VACUITY GUARD, not the contract assert four
    lines above it — `if code == ExitOK` did NOT fire, so the driver correctly
    refused to complete a churning deliverable and the property under test
    HELD), same `retry_outcome: "red-on-retry"` from a back-to-back retry under
    the same contention, same ~0.46s predicate duration, same
    non-reproducibility. See
    [[cycle-1236-driver-contract-predicate-flakes-with-diagnostics-discarded]],
    which diagnosed all of this already.

    NOT REPRODUCIBLE, AGAIN. In this retrospective, in the cycle's own worktree
    against the same tree the gate saw: the inner test alone 1/1 green; 6/6
    green under 28 spinning `yes` processes on a 14-core host; the full
    `go test -tags acs ./acs/cycle1249/` 3/3 green (002 at 0.83s) while six
    concurrent full `./internal/bridge/` suites ran. 10/10 green, 0 red.

    THREE THINGS ARE NEW AND ALL THREE ARE THE ACTIONABLE PART.

    (1) THE FIX WAS PRESCRIBED AND NEVER LANDED. Cycle 1236's preventive action
    (1) is a named two-line edit: make the `rev.calls < 2` `t.Fatalf` print
    `code` and `stderr`, exactly as the contract assert above it already does.
    That edit was written into a lesson YAML and nowhere else. Cycle 1249
    TOUCHED that very file — `completion_debounce_test.go` is staged `A` in the
    cycle diff — and line 290 still discards `code` and `stderr`. So the 1249
    red is undiagnosable for precisely the reason 1236 said it would be. A
    lesson is not a landed change; this is [[lesson_to_action_gap]] with a
    thirteen-cycle, measured cost.

    (2) THE RECURRENCE COUNTER CANNOT SEE THE RECURRENCE.
    `failure-digest.json` reports `recurrence: 0` under fingerprint
    `audit|gate-block|f578cacf9ed7`. It is a second occurrence of one
    mechanism, but the fingerprint derives from the per-cycle ACS id
    (`TestC1236_004_...` vs `TestC1249_002_...`), and every cycle mints fresh
    predicate names by design. A defect class that re-appears behind a new
    per-cycle name therefore reads as NOVEL forever, and no escalation rule
    keyed on `recurrence` can ever fire for it. The counter is structurally
    blind to exactly the class the escalation lever exists for.

    (3) THE VERDICT CONFLICT WAS RECORDED AND OVERRULED CORRECTLY, AND STILL
    COST THE CYCLE. `audit-fail-reason.json` states it plainly: "auditor
    narrative=WARN but 1 deterministic gate(s) forced FAIL [EGPS red_count>0]".
    The auditor independently re-executed everything (9/9 packages, 3/3 ACS
    predicates, `red_count=0`), found the fix correct, graded it WARN with
    "Ship is not blocked", and cited only two non-blocking doc/invariant
    defects. The gate outranking the narrative is the right policy against a
    captured auditor. But when the gate's red is a non-hermetic vacuity guard
    that nobody can reproduce, the policy converts a correct WARN into a lost
    cycle. The gate needs a way to say "red, but off-contention this is green"
    WITHOUT weakening `red_count==0` — see
    [[cycle-352-egps-cannot-honor-auditor-false-red-adjudication]].
