  doubleLoopChange: >-
    GOVERNING VALUE before cycle 1249: "The learning loop closes when the
    retrospective names the root cause and prescribes the fix; filing it as a
    durable lesson is the deliverable."

    GOVERNING VALUE after cycle 1249: "A retrospective that prescribes a
    two-line edit and does not cause that edit to LAND has not closed anything
    — it has produced a record of a defect that will recur. For a fix small
    enough to be described exactly (file, line, replacement), the retrospective
    must route it to the console lane for immediate application, and the
    recurrence counter must be able to recognise the class when it returns.
    Otherwise the pipeline durably persists its diagnoses and durably repeats
    its failures."
