  governingVariable: >-
    Wrong assumption: "recording a preventive action in a lesson YAML is
    equivalent to preventing the failure." True relationship: a lesson changes
    what an agent MIGHT recall; only a landed diff changes what the pipeline
    DOES. Cycle 1236 identified a two-line edit, named the file and the line,
    and cycle 1249 was blocked by that exact line while editing that exact
    file. The corollary is that recurrence-detection must be keyed on the
    MECHANISM (the inner test name + the failing assertion), never on the
    per-cycle predicate id, because the pipeline mints a fresh predicate id
    every cycle and therefore erases its own memory of the class.
  preventiveAction: >-
    (1) LAND THE 1236 TWO-LINE EDIT, NOW, AS A CONSOLE CHANGE — not as a queued
    cycle. In `go/internal/bridge/completion_debounce_test.go:290` (live on
    branch `cycle-42824668-1236`; this file is NOT in `main`) change
      t.Fatalf("reviewer ran %d time(s): ...", rev.calls)
    to also print `code` and `stderr`, exactly as the contract assert at :286
    already does. Two occurrences of this class are now on record; the third
    must be diagnosable on first sight.

    (2) MAKE THE VACUITY GUARD A SKIP, NOT A RED. `rev.calls < 2` asserts "this
    test got to exercise its claim", which is a statement about the RUN, not
    about the code under test. When it fires and the contract assert did not,
    the correct outcome is `t.Skipf` (surfaced as SKIP-with-warn in the ACS
    verdict, already a first-class state — 53 skips this cycle) rather than a
    ship-blocking FAIL. A test that admits it did not test anything must not be
    allowed to claim the code is broken.

    (3) FINGERPRINT THE MECHANISM, NOT THE PREDICATE NAME. The failure-digest
    fingerprint must incorporate the inner failing test name and the failing
    assertion text (both are present in `acs-red-evidence/*.txt`), so that
    `TestC1236_004` and `TestC1249_002` failing on the SAME inner assertion
    hash to the same fingerprint and `recurrence` reflects reality. Until this
    lands, every recurrence-keyed escalation lever is inert for per-cycle
    predicates.

    (4) SPACE THE RETRY OR RUN IT OUTSIDE THE SWEEP. `retry_outcome:
    "red-on-retry"` was produced back-to-back inside the same 204-predicate
    sweep. That is not an independent trial and it is the second time it has
    manufactured a confirming signal for an irreproducible red. Retries of
    driver-level predicates must run after the sweep's load has drained.

    (5) SPLIT HERMETIC FROM NON-HERMETIC PREDICATES (1236 PA-3, re-earned).
    001 and 003 are green, in-process, deterministic. 002 is a single
    full-driver reachability proof whose failure mode is indistinguishable from
    host noise. Keep the un-gameable caller proof as EVIDENCE; stop letting it
    spend the cycle's ship eligibility in the same `red_count`.

    (6) DO NOT RE-RUN UNTIL GREEN. 10/10 reproduction is evidence the tree was
    sound, not permission to reroll the gate.
