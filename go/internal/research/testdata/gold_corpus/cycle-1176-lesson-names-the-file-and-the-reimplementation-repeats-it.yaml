    auditDefects:
      - "D1 HIGH (blocking): gcWorkspaceSweep infers the project root from process cwd and proceeds to the mutating gc.ApplyWorktrees path, violating TDD contract clause 1 and reproducing cycle-1165's D1 verbatim in renamed code"
    upstreamSignals:
      - "the inbox item id is UNCHANGED from the failing cycle (workspace-hygiene-s5-wiring-shadow-default); a repeat of a previously-failed item is the strongest available prior, and nothing consumed it"
      - "the TDD contract header transcribed the invariant into prose and then authored tests for the other three clauses only — the clause with a prior FAIL got the least coverage"
      - "the function rename (resolveGCProjectRoot -> gcWorkspaceSweep) silently defeats any grep-based or text-similarity link between the lesson and the new code"
      - "the recurrence is invisible to the failure fingerprint: failure-digest.json reports recurrence=0 because it keys on verdict shape (audit|verdict-fail|027c8af478b9), not on the defect class or the item id"
  governingVariable: >
    Wrong assumption: "writing a high-confidence, highly-specific lesson prevents the
    recurrence it describes." True relationship: a lesson binds only where something
    MECHANICALLY consults it at the moment of authorship. Specificity does not
    substitute for binding — cycle-1165's lesson could not have been more specific
    (right file, right invariant, right fix, right test-shape gap) and it changed
    nothing, because the only channel between it and the next author is a prose
    digest that is retrieval-conditioned, rename-fragile, and advisory. Worse, the
    recurrence detector cannot see the recurrence: fingerprinting on verdict shape
    reports recurrence=0 for the second occurrence of an identical defect on an
    identical inbox item, so the escalation that should have fired never does.
    A lesson that names a FILE is data; treating it as a warning delivered to a
    human reader is what makes it inert.
  preventiveAction: >
    (1) FILE-ANCHORED LESSON INJECTION — every lesson YAML that cites concrete
    `path:line` sources must be indexed by PATH. When any phase's planned scope
    touches an indexed path, that lesson's `preventiveAction` is injected verbatim
    into the phase prompt as a MUST-CHECK list, and the phase report must state, per
    injected item, "applied" or "not applicable because <reason>". Rename-proof
    because it keys on the file, not the symbol.
    (2) ITEM-ID RECURRENCE IS A FIRST-CLASS SIGNAL — when an inbox item id that
    previously produced a FAIL is re-planned, Triage must surface the prior cycle's
    audit defects in its rationale and TDD must open its contract with a clause
    per prior defect. `workspace-hygiene-s5-wiring-shadow-default` failed at 1165
    and was re-planned at 1176 with no phase mentioning 1165.
    (3) FINGERPRINT THE DEFECT, NOT THE VERDICT — extend the S1 assembler so
    `recurrence` also counts prior failures matching (inbox item id) or (audit
    defect's primary file:symbol). recurrence=0 on an exact repeat is a
    false-negative that suppresses every downstream escalation lever.
    (4) EVERY NUMBERED CONTRACT CLAUSE NEEDS A NAMED TEST — the TDD handoff must
    carry a clause -> test-function mapping, and `evolve phase verify tdd` must
    reject a contract clause with no test named against it. Clause 1 here was
    unmapped and unenforced, which is precisely how a known defect walked back in.
    (5) PROMOTE THE INVARIANT INTO THE ENGINE (cycle-1165 preventive #3, still
    unlanded): `gc.PlanWorktrees` must reject a `ProjectRoot` that is not a
    repository top-level. A prohibition living in one caller's comment cannot bind
    the next caller, and this cycle is the proof.
