- id: cycle-1176-lesson-names-the-file-and-the-reimplementation-repeats-it
  pattern: "a-0.95-confidence-lesson-naming-the-exact-file-invariant-and-fix-fails-to-bind-a-reimplementation-of-the-same-inbox-item-eleven-cycles-later"
  description: >-
    Cycle 1165 FAILED on this exact defect. Its retro wrote
    [[cycle-1165-invariant-in-prose-with-a-guard-test-that-cannot-fail]] at
    confidence 0.95, naming the file (`go/cmd/evolve/cmd_gc.go`), the invariant
    ("Never infer the repo from the process cwd" —
    `go/cmd/evolve/cmd_loop_outcome.go:161-168`), the mechanism (`resolveGCProjectRoot`
    falls through flag -> env -> cwd with no repo-root validation), and two
    preventive actions in imperative voice:
      (2) "EXERCISE THE DEFAULT INVOCATION — when a flag has a fallback chain, at
          least one test must OMIT the flag. Cycle 1165's entire suite passed
          `-project-root` explicitly, so the fallback that carried the whole risk
          had zero coverage."
      (3) "INVARIANT LOCALITY — that prohibition must be moved into the ENGINE
          (`gc.PlanWorktrees` should reject a root that is not a repo top-level)…
          A comment in caller A cannot bind caller B."

    Cycle 1176 worked the SAME inbox item (`workspace-hygiene-s5-wiring-shadow-default`,
    `.evolve/inbox/2026-07-06T18-05-00Z-workspace-hygiene-s5.json`) and reproduced
    the defect exactly, in freshly-authored code:

      - the function was renamed (`resolveGCProjectRoot`/`sweepWorkspace` ->
        `gcWorkspaceSweep`), so no textual match links the new code to the lesson;
      - `go/cmd/evolve/cmd_gc.go:109-119` resolves an empty `--project-root` to
        `os.Getwd()` and falls through to the MUTATING `gc.ApplyWorktrees`
        (`cmd_gc.go:155`) — identical semantics, identical blast radius;
      - the doc comment at `cmd_gc.go:110-112` claims "Same refusal posture as
        runWorktreeGC on an empty ProjectRoot" and implements the inverse — the
        "invariant restated in prose that cannot execute" shape, verbatim;
      - preventive action (2) was not applied: all three new tests
        (`cmd_gc_workspace_test.go:69,94,112`) pass `--project-root` EXPLICITLY.
        Zero tests exercise the empty-root path. Again.
      - preventive action (3) was not applied: `gc.PlanWorktrees` still accepts an
        unvalidated root, so the second caller re-inherited the hazard.

    The TDD phase even TRANSCRIBED the invariant into its contract header
    (`cmd_gc_workspace_test.go:16-19`, clause 1: "Never infer the repo implicitly
    for a MUTATING run — same refusal posture runWorktreeGC already takes") and
    then authored tests for clauses 2, 3 and 4 only. The clause that had already
    cost a cycle was the one clause left as prose.

    The lesson's DIAGNOSIS was perfect and its EFFECT was zero. It is retrieval-
    conditioned prose in `instinctSummary`: nothing anchors it to the file it
    indicts, so a rename defeats it, and nothing converts its imperative
    preventive actions into a check any phase must pass.
