      - "H2 HIGH fixture-only-classifier: eventLogHasTokens reads a top-level int `tokens` no producer emits (0 of 2727 live lines) and strings.Contains(lastGoodPane, resolvedPrompt) needs a ~27KB prompt verbatim in a pane the file's own tmuxPastePlaceholderEcho comment says never renders it"
      - "L1 LOW dispatch vocabulary embedded as Go string literals at two driver sites with nothing single-sourcing them against phaseAgentName"
  preventiveAction: >-
    TWO RULES, BOTH MECHANICAL.

    (1) NO PREDICATE MAY BE FED A VALUE THE AUTHOR TYPED. Any new comparison
    against a dispatch name, phase name, agent name, CLI name or on-disk log
    field must take its expected value from the PRODUCER, not from a literal:
    import the producer's symbol, or read one real line out of the corpus. In
    this repo, concretely: (a) EXPORT a single-source accessor for the
    phase→agent table (core.phaseAgentName, core/phase_agent_names.go:24) and
    have the bridge compare against it instead of "retro"/"claude-tmux" string
    literals — the existing drift guard phase_agent_names_test.go proves the
    table matches the profiles on disk, so the whole chain becomes checkable;
    (b) any function reading `<phase>-events.ndjson` must decode the v2.0
    envelope (`schema_version/seq/ts/trace_id/source/kind/severity/data`) and be
    covered by a test whose input is a REAL LINE copied from a prior cycle's
    workspace, not an authored literal — the same corpus-over-name rule as
    [[cycle-1204-json-field-shape-inferred-from-name-not-corpus]].

    (2) RED-FIRST IS NOT ENOUGH — ADD THE LITERAL-MUTATION STEP. Before a task
    is claimed PASS, mutate each new literal/fixture value to the value
    PRODUCTION emits and re-run the test. If the test stays green, the guard is
    unreachable; if it reds, the fixture was lying. This is exactly the M1/M2/M3
    probe the auditor ran in minutes with `go test -overlay`; running it in the
    build phase converts a whole class of FAIL cycles into a caught mistake.
    Red-first over a fabricated input is red for the wrong reason and proves
    nothing about the dispatched path.

    RED-FIRST TEST FOR THE FIX ITSELF: launch the submit-verify fixture with
    `--agent=` set from core's phase→agent accessor (NOT the literal "retro")
    and assert exactly one relaunch; assert the guard is also red when the agent
    name is any OTHER dispatched phase name, so the scope claim in the build
    report is proven rather than asserted.
