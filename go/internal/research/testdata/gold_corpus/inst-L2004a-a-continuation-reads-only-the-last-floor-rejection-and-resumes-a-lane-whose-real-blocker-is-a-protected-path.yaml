  description: >-
    SYSTEMIC (the third run of retro-minting-files-through-inbox-add-lane:
    cycles 1983, 2001 and 2004 all failed because the floor-minted remediation item
    is built in protected go/internal/core/failurelearning/remediation.go). Cycle 2004
    was a continuation of cycle 2001. Its continuation-manifest.json pointed at
    cycle-2001/audit-fail-reason.json, and that file records only the LAST floor
    rejection (the Changed Areas line about remediation.go). The protected-path
    refusals of the earlier correction rounds are in signals.ndjson only. The scout
    then wrote "its build failed only the explanation-documentation floor", and the
    plan was "restore the snapshot and fix Changed Areas". The inbox item was still
    route=lane, deps=null, so the cycle-2001 remedy (deps on the console sibling)
    never took effect. The build restored the four protected paths (ADR-0064). The
    new writer refuses items without summary/fix, so the floor files nothing, and the
    lane's own ACS predicates TestC2004_007 and TestC2004_009 went red. The
    rejection is legit. The explanation document also claimed "ACS green, 001 to 015
    green" while 007/009 were red.
