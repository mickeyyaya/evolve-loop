  preventiveAction: >-
    A continuation must read every refusal of the prior cycle, not only
    audit-fail-reason.json: before planning, Scout greps the prior cycle's
    signals.ndjson for ORCHESTRATOR_GATE_CORRECTION and "protected control-plane
    path". If any acceptance predicate needs a protected path, the item is
    console-owned: defer it with "waits for <console sibling id>". Do not resume the
    snapshot. The runtime should add every correction-round reason to
    audit-fail-reason.json (or to the continuation manifest). An item that failed
    twice on the same protected wall must be routed to console by the inbox edit
    verb, not by a carryover todo. Builder: the explanation's Verification section
    states the final ACS result, never the result of an earlier round.
