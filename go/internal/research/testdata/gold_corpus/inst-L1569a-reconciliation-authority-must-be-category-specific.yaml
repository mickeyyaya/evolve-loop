  pattern: "reconciliation-authority-must-be-category-specific"
  description: >-
    Treat each SystemFailure category as a separate authority domain. Never clear
    an existing floor signal merely because the audit/ACS verdict-incoherence
    predicate reconciled: first prove the signal being cleared is itself
    `verdict-incoherence`, then re-evaluate every independent floor source that
    the earlier signal may have short-circuited. Cycle 1569 made a narrow
    audit-artifact predicate decisive over the whole `SystemFailure` value, so
    green audit bytes could erase an `infra-systemic` halt the predicate never
    observed.
