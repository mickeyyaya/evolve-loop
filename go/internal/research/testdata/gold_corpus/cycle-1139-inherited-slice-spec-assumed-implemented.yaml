- id: cycle-1139-inherited-slice-spec-assumed-implemented
  pattern: "resumed-worktree-green-tests-read-as-spec-conformance-so-the-dependency-slice-gap-is-never-checked"
  description: >
    Cycle-1139 resumed a preserved worktree (ADR-0076 continuation) whose HEAD already
    carried the S5 production wiring written by the killed cycle-1137/attempt-2 run. The
    builder ran "verification-first triage", found the wiring live and the tests green,
    and explicitly narrowed scope: "closed the three remaining gaps rather than rebuilding
    what existed" (build-report.md:20-22). What it never did was diff the INHERITED code
    against the plan the inherited code was supposed to implement.
    The plan (docs/plans/workspace-hygiene-2026-07.md:40, S4 bullet) specifies
    `WorktreesPolicy{KeepRecent(2), MinAgeMinutes(15 — wider than 10-min lease TTL,
    covers create→lease window)}` embedded as `gc.Policy.Worktrees` "+ withDefaults()".
    S4 landed the STRUCT but not the DEFAULTING: `gc.go:72-86` withDefaults() populates
    Runs.KeepFull / SalvageTTLDays / LogsTTLDays / TrackerTTLDays and never touches
    Worktrees. S5 then wired the engine assuming the grace existed, and passed the loaded
    policy RAW at both new call sites (`cmd_loop_outcome.go:129`, `cmd_gc.go:129` —
    `Policy: gcPol.Worktrees`), so even a fixed withDefaults() would not reach them.
    Shipped values: KeepRecent=0, MinAgeMinutes=0 — both grace checks
    (`worktrees.go:334`, `worktrees.go:342`) are dead code. bug-reproduction executed this
    against the real binary (repro/repro_f1.sh): a worktree created THAT INSTANT was
    WOULD-REMOVE'd and applied, branch deleted. Audit D1, CRITICAL.
    The same substitution of design-intent for implementation-state ran through every
    other layer of the diff:
    - DOCS (D2, CRITICAL): runtime-reference.md, added by this diff, asserts live lanes are
      protected by a "triple shield (lease-before-state ordering + MinAgeMinutes + a
      per-item TOCTOU re-check)" so a mid-sweep lane is "never" collected. MinAgeMinutes is
      0 in every shipped config; the diff's OWN source comment contradicts it
      (`gc.go:54` — "Zero value = no KeepRecent/MinAge grace"). The doc was written from
      the plan's safety model, not from the source. The drain runbook in the same diff tells
      the operator to arm `enforce` on the strength of that sentence.
    - TESTS (D3, HIGH): 6/6 ACS predicates + 8/8 hook tests green, and genuinely
      non-degenerate (EffectiveMode tables, manifest atomicity, hook invocation,
      finalize→hook ordering, dry-run zero-mutation; the enforce test's two arms kill both
      no-op and delete-everything implementations). But the predicate set was authored from
      the S5 spec's named tests, which are all about WIRING; not one pins a non-zero grace
      VALUE. "20/20 PASS, no regression" is accurate and simultaneously uninformative about
      the single property that matters for a default-on destructive sweep.
    - PLAN STATUS (D6, MEDIUM): the same diff edits the plan to read "S5 … — LANDED
      (cycle-1139)" in the past tense while the slice is uncommitted (ship correctly refused
      with AUDIT_BINDING_HEAD_MOVED), unaudited, and now carrying a confirmed CRITICAL. The
      plan doc is what the NEXT scout reads to decide the work is done — intent written as
      fact, one step from a replicated false belief.
    ROOT CAUSE: green tests on inherited code certify that the code does what ITS OWN TESTS
    say. They say nothing about what the PLAN said the code must do. Treating a resumed
    worktree's green suite as a conformance check silently converts every unimplemented
    spec clause in the dependency slice into a shipped default — and because the builder
    then writes the docs and the plan status from the same design document, the gap is
    papered over in prose at exactly the moment it becomes reachable in production.
  confidence: 0.88
  source: >
    .evolve/runs/cycle-1139/audit-report.md D1 (CRITICAL), D2 (CRITICAL), D3 (HIGH),
