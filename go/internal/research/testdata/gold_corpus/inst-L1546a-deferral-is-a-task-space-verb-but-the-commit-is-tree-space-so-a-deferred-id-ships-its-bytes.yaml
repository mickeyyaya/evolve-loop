  preventiveAction: >-
    Add a ship-time / pre-audit SUBSET CHECK: the staged path set must be a subset of
    (top_n declared footprint UNION the ship manifest). Emit a hard block naming each
    staged path attributable to a DEFERRED or unselected id. Independently, teach the
    disposition gate to reject `status: DEFERRED` for any defect id whose recorded file
    footprint intersects `git diff --cached --name-only` — a deferral that ships is a
    mislabelled delivery, and the vocabulary must be unable to express it.
