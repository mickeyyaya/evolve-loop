  description: "When a single counter drives two independent policies, suppressing it to satisfy one policy silently disarms the other. cyclerun_review.go advances rr.Blocks only through reviewDeliverable, and that same counter is BOTH the contract-gate breaker's pressure AND the sole trigger for CLI escalation (rr.Blocks >= contractEscalateAtBlock, cyclerun_review.go:183). Freezing it for 'breaker neutrality' therefore pins it below the escalation threshold forever: a CLI that dies pre-write every round — the exact failure the change exists to diagnose — never escalates to another family, which was the one remedy that could survive context exhaustion. The suppression was even test-locked as intended (contract_freshness_test.go:119-121 asserts dispatched[2]==\"\"), so a green suite ratified the disarmament."
