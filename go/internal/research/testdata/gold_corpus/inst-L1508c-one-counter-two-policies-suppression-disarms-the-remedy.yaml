  preventiveAction: "Before suppressing or freezing any counter, grep every read site of that field and name each policy it drives. If it drives more than one, introduce a SEPARATE counter for the new policy rather than reusing the existing one: here, count no-rewrite rounds in their own field and let CLI escalation trigger on it, leaving the contract gate's block count and breaker untouched. A test that asserts the suppressed side-effect is not evidence of correctness — it locks the omission in."
