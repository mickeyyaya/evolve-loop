name: landing-pages

# Builds the static landing site (landing/dist) with the Go SSG and publishes it
# to GitHub Pages. Scoped to landing/ so it never runs for product changes.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing-pages.yml'
      - 'install.sh'
      - 'docs/explain/**'
  pull_request:
    paths:
      - 'landing/**'
      - '.github/workflows/landing-pages.yml'
      - 'install.sh'
      - 'docs/explain/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test landing module
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Test and vet landing
        working-directory: landing
        run: |
          go test -race -count=1 ./...
          go vet ./...

  build:
    name: build site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      - name: Render content + templates → dist
        working-directory: landing
        run: go run ./cmd/build
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: landing/dist

  deploy:
    name: deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
