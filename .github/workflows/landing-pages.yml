name: landing-pages

# Builds the static landing site (landing/dist) with the Go SSG and publishes it
# to GitHub Pages. Pull requests use the same validation via required.yml.
on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/landing-pages.yml'
      - '.github/workflows/landing-validation.yml'
      - 'install.sh'
      - 'docs/explain/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test landing module
    uses: ./.github/workflows/landing-validation.yml
    permissions:
      contents: read

  build:
    name: build site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-dist
          path: landing/dist
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: landing/dist

  deploy:
    name: deploy to Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
