name: required CI

# Always create the required result; select expensive suites inside the graph.
on:
  push:
    branches: [main, go-rewrite-phase-1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.paths.outputs.go }}
      landing: ${{ steps.paths.outputs.landing }}
      docs_only: ${{ steps.paths.outputs.docs_only }}
      docs: ${{ steps.paths.outputs.docs }}
      inbox: ${{ steps.paths.outputs.inbox }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Select required suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          route() {
            printf 'go=%s\nlanding=%s\ndocs_only=%s\ndocs=%s\ninbox=%s\n' "$1" "$2" "${3:-false}" "${4:-false}" "${5:-false}" >> "$GITHUB_OUTPUT"
            exit
          }
          case "$EVENT_NAME" in
            workflow_dispatch) route true true false false true ;;
            push|pull_request) ;;
            *) echo "unsupported CI event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'CI routing requires valid base and head commit IDs' >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == push && "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            route true true false false true
          fi
          base="$BASE_SHA"
          if [[ "$EVENT_NAME" == pull_request ]] && ! base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
            echo 'unable to determine the PR merge-base' >&2
            exit 1
          fi
          # --no-renames keeps both old and new paths in the decision.
          if ! git diff --no-renames --name-only -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/ci-paths"; then
            echo 'unable to determine changed paths' >&2
            exit 1
          fi
          if [[ ! -s "$RUNNER_TEMP/ci-paths" ]]; then
            route true true false false true
          fi
          go_required=false
          landing_required=false
          docs_found=false
          other_found=false
          inbox_found=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/explain/*.md|docs/conventions/ste100-writing.md) docs_found=true; other_found=true ;;
              README.md|CLAUDE.md|AGENTS.md|CHANGELOG.md|docs/*.md) docs_found=true ;;
              *) other_found=true ;;
            esac
            case "$path" in
              go/*|skills/*|agents/*) go_required=true ;;
              landing/*|docs/explain/*) landing_required=true ;;
              docs/reports/*.md|docs/research/*.md|docs/private/*.md) ;;
              .evolve/inbox/*) inbox_found=true ;;
              *) go_required=true; landing_required=true ;;
            esac
          done < "$RUNNER_TEMP/ci-paths"
          if [[ "$EVENT_NAME" != pull_request || "$docs_found" != true ]]; then
            route "$go_required" "$landing_required" false false "$inbox_found"
          fi
          if [[ "$other_found" == true ]]; then
            route "$go_required" "$landing_required" false true "$inbox_found"
          fi
          route false false true true

  validate:
    name: plugin and durable ACS
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    uses: ./.github/workflows/ci.yml

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/go.yml

  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    uses: ./.github/workflows/landing-validation.yml

  inbox:
    name: inbox lint
    needs: changes
    if: needs.changes.outputs.inbox == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build evolve
        working-directory: go
        run: go build -o "$RUNNER_TEMP/evolve" ./cmd/evolve
      - name: Lint the inbox
        run: |
          status=0
          "$RUNNER_TEMP/evolve" inbox lint 2> "$RUNNER_TEMP/inbox-lint.err" || status=$?
          cat "$RUNNER_TEMP/inbox-lint.err" >&2
          if grep -q ': WARN skipped ' "$RUNNER_TEMP/inbox-lint.err"; then
            echo 'an inbox item is unreadable, so the loaders skip it' >&2
            exit 1
          fi
          exit "$status"
      - name: Tests that read the tracked inbox
        working-directory: go
        run: go test -count=1 ./internal/phasecoherence/

  ste-lint:
    name: STE lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build the lint
        working-directory: go
        run: go build -o "$RUNNER_TEMP/evolve" ./cmd/evolve
      - name: Check the research index
        run: '"$RUNNER_TEMP/evolve" docs index check --project-root "$GITHUB_WORKSPACE"'
      - name: Check the rule registry and its generated index
        run: '"$RUNNER_TEMP/evolve" guidance check --project-root "$GITHUB_WORKSPACE"'
      - id: lint
        name: Lint the added text
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git merge-base "refs/remotes/origin/$BASE_REF" "$HEAD_SHA")
          "$RUNNER_TEMP/evolve" docs ste-lint --strict --changed "$base" --added --project-root "$GITHUB_WORKSPACE"

  required:
    name: CI required
    needs: [changes, validate, go, landing, inbox, ste-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - id: result
        name: Require every selected suite to succeed
        env:
          ROUTE_RESULT: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS_REQUIRED: ${{ needs.changes.outputs.docs }}
          STE_LINT_RESULT: ${{ needs.ste-lint.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PLUGIN_RESULT: ${{ needs.validate.outputs.plugin_result }}
          ACS_RESULT: ${{ needs.validate.outputs.acs_result }}
          GO_REQUIRED: ${{ needs.changes.outputs.go }}
          GO_RESULT: ${{ needs.go.result }}
          GO_SUITE_RESULT: ${{ needs.go.outputs.suite_result }}
          LANDING_REQUIRED: ${{ needs.changes.outputs.landing }}
          LANDING_RESULT: ${{ needs.landing.result }}
          LANDING_SUITE_RESULT: ${{ needs.landing.outputs.suite_result }}
          INBOX_REQUIRED: ${{ needs.changes.outputs.inbox }}
          INBOX_RESULT: ${{ needs.inbox.result }}
        shell: bash
        run: |
          if [[ "$ROUTE_RESULT" != success ]]; then
            echo "CI prerequisite did not succeed: $ROUTE_RESULT" >&2
            exit 1
          fi
          case "$DOCS_ONLY:$DOCS_REQUIRED:$VALIDATE_RESULT:$PLUGIN_RESULT:$ACS_RESULT" in
            false:true:success:success:success|false:false:success:success:success|true:true:skipped::) ;;
            *) echo "plugin and durable ACS validation did not match the route: $DOCS_ONLY:$DOCS_REQUIRED:$VALIDATE_RESULT:$PLUGIN_RESULT:$ACS_RESULT" >&2; exit 1 ;;
          esac
          case "$DOCS_REQUIRED:$STE_LINT_RESULT" in
            true:success|false:skipped) ;;
            *) echo "STE lint did not match the route: $DOCS_REQUIRED:$STE_LINT_RESULT" >&2; exit 1 ;;
          esac
          case "$INBOX_REQUIRED:$INBOX_RESULT" in
            true:success|false:skipped) ;;
            *) echo "inbox lint did not match the route: $INBOX_REQUIRED:$INBOX_RESULT" >&2; exit 1 ;;
          esac
          for result in "$GO_REQUIRED:$GO_RESULT:$GO_SUITE_RESULT" "$LANDING_REQUIRED:$LANDING_RESULT:$LANDING_SUITE_RESULT"; do
            case "$result" in
              true:success:success|false:skipped:) ;;
              *) echo "required CI work did not succeed: $result" >&2; exit 1 ;;
            esac
          done
          echo 'Every required suite succeeded; other suites were explicitly unselected.'
