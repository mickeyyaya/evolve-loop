name: required CI

# Always create the required result; select expensive suites inside the graph.
on:
  push:
    branches: [main, go-rewrite-phase-1]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.paths.outputs.go }}
      landing: ${{ steps.paths.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        name: Select required suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          go_required=true
          landing_required=true
          case "$EVENT_NAME" in
            workflow_dispatch) ;;
            push|pull_request)
              if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo 'CI routing requires valid base and head commit IDs' >&2
                exit 1
              fi
              if [[ "$EVENT_NAME" != push || "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
                base="$BASE_SHA"
                if [[ "$EVENT_NAME" == pull_request ]]; then
                  if ! base=$(git merge-base "$BASE_SHA" "$HEAD_SHA"); then
                    echo 'unable to determine the PR merge-base' >&2
                    exit 1
                  fi
                fi
                # --no-renames keeps both old and new paths in the decision.
                if ! git diff --no-renames --name-only -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/ci-paths"; then
                  echo 'unable to determine changed paths' >&2
                  exit 1
                fi
                if [[ -s "$RUNNER_TEMP/ci-paths" ]]; then
                  go_required=false
                  landing_required=false
                  while IFS= read -r -d '' path; do
                    case "$path" in
                      go/*|skills/*|agents/*) go_required=true ;;
                      landing/*|docs/explain/*) landing_required=true ;;
                      docs/reports/*.md|docs/research/*.md|docs/private/*.md) ;;
                      *) go_required=true; landing_required=true ;;
                    esac
                  done < "$RUNNER_TEMP/ci-paths"
                fi
              fi
              ;;
            *) echo "unsupported CI event: $EVENT_NAME" >&2; exit 1 ;;
          esac
          printf 'go=%s\nlanding=%s\n' "$go_required" "$landing_required" >> "$GITHUB_OUTPUT"

  validate:
    name: plugin and durable ACS
    uses: ./.github/workflows/ci.yml

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/go.yml

  landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true'
    uses: ./.github/workflows/landing-validation.yml

  required:
    name: CI required
    needs: [changes, validate, go, landing]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - id: result
        name: Require every selected suite to succeed
        env:
          ROUTE_RESULT: ${{ needs.changes.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PLUGIN_RESULT: ${{ needs.validate.outputs.plugin_result }}
          ACS_RESULT: ${{ needs.validate.outputs.acs_result }}
          GO_REQUIRED: ${{ needs.changes.outputs.go }}
          GO_RESULT: ${{ needs.go.result }}
          GO_SUITE_RESULT: ${{ needs.go.outputs.suite_result }}
          LANDING_REQUIRED: ${{ needs.changes.outputs.landing }}
          LANDING_RESULT: ${{ needs.landing.result }}
          LANDING_SUITE_RESULT: ${{ needs.landing.outputs.suite_result }}
        shell: bash
        run: |
          for result in "$ROUTE_RESULT" "$VALIDATE_RESULT" "$PLUGIN_RESULT" "$ACS_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "CI prerequisite did not succeed: $result" >&2
              exit 1
            fi
          done
          for result in "$GO_REQUIRED:$GO_RESULT:$GO_SUITE_RESULT" "$LANDING_REQUIRED:$LANDING_RESULT:$LANDING_SUITE_RESULT"; do
            case "$result" in
              true:success:success|false:skipped:) ;;
              *) echo "required CI work did not succeed: $result" >&2; exit 1 ;;
            esac
          done
          echo 'Every required suite succeeded; other suites were explicitly unselected.'
