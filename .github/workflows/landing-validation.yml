name: landing validation

on:
  workflow_call:
    outputs:
      suite_result:
        description: Result of the required test job
        value: ${{ jobs.test.outputs.result }}

permissions:
  contents: read

jobs:
  test:
    outputs:
      result: ${{ job.status }}
    name: test landing module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: false
      - name: Test, vet and render landing
        working-directory: landing
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go run ./cmd/build
      - uses: actions/upload-artifact@v4
        with:
          name: landing-dist
          path: landing/dist
          if-no-files-found: error
          include-hidden-files: true
